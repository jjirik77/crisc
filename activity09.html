        { text: 'The patient portal business case does not say which hospital objective it supports or what risks it brings.', answer: 0, why: 'A business case with a risk section, approved through the portfolio, is the initiation gate.' },
        { text: 'No one stated that the new telehealth app must keep an audit log of who views each patient record.', answer: 1, why: 'Security, privacy, and compliance needs belong in the requirements, before anyone designs or builds.' },
        { text: 'The scheduling service accepts any request that comes from the internal network, without checking who sent it.', answer: 2, why: 'Excessive trust is an architectural flaw. Threat modeling and architecture review in design catch it.' },

        { text: 'The billing module is tested with a full copy of real patient records.', answer: 4, why: 'Test data should be masked or synthetic. That control belongs to the testing phase.' },

            { text: 'Weekly full backup to offline tape', rank: 4, why: 'Up to a week of data can be lost. It is a good immutable copy, but a poor RPO on its own.' },

      hint: 'Collect only what you need (minimization). Use it only for the stated purpose (purpose limitation). Keep it no longer than needed (storage limitation). Keep it correct (accuracy). Be able to prove all of it (accountability). Security protects confidentiality, but it does not settle the other principles.',

          title: 'Case 2: The wellness campaign', text: 'Marketing wants to use treatment records to target patients with a paid wellness program. Patients were told the data was collected for their care.',
          parts: [

          parts: [
            { q: 'Which principle does the extract breach?', options: ['Storage limitation', 'Lawfulness', 'Integrity and confidentiality', 'Accuracy'], answer: 0, why: 'Identifiable data kept longer than the purpose requires breaches storage limitation.' },
            { q: 'What is the BEST response to the IT director?', options: ['Agree, since encryption is the main privacy control', 'Explain that encryption protects confidentiality but does not address retention, purpose, or minimization, and recommend a retention rule with automated deletion', 'Recommend stronger encryption', 'Move the extract to a different server'], answer: 1, why: 'A system can be perfectly secure and still breach privacy law. Retention needs its own control.' }

          title: 'Case 5: The misdirected export', text: 'On Monday at 09:00, the clinic confirms that a file of patient records was sent to the wrong external party and cannot be recovered.',

        }

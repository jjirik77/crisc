<script>
window.ACTIVITY = {
  id: 'A1',
  title: 'Think Like a Risk Practitioner: Roles, Ethics, and the Best Answer',
  accent: 'Roles, Ethics, and the Best Answer',
  domain: 'All domains, Domain 1 (26%)',
  time: '35 min',
  level: 'Foundational',
  lessonHref: 'lesson00.html#s5',
  lessonLabel: 'Lesson 0, The Risk Practitioner Mindset',
  lede: 'CRISC rewards the answer a risk practitioner would give. The practitioner identifies, analyzes, recommends, facilitates, and reports. The risk owner decides and accepts. Practice the lens at Fernhollow Utilities, a regional water and electric utility: business first, assess before you respond, process and ownership before tools, and the ISACA Code of Professional Ethics when the pressure is on.',
  concepts: [
    { key: 'roles', name: 'Who decides, who advises', review: 'Lesson 0, The ISACA Code of Professional Ethics and the Practitioner’s Role' },
    { key: 'best', name: 'Reading FIRST, BEST, and MOST', review: 'Lesson 0, The Risk Practitioner Mindset and Best-Answer Tactics' },
    { key: 'process', name: 'The risk management sequence', review: 'Lesson 0, The 24 Supporting Tasks' },
    { key: 'ethics', name: 'The ISACA Code in practice', review: 'Lesson 0, The ISACA Code of Professional Ethics' }
  ],
  stations: [
    {
      type: 'sort', short: 'Whose job?', title: 'Practitioner, risk owner, control owner, or auditor?', concept: 'roles',
      instr: 'Each statement was overheard at Fernhollow Utilities. Decide whose role it reflects: the <b>risk practitioner</b> (second-line risk function), the <b>risk owner</b> (the business leader accountable for the risk), the <b>control owner</b> (who operates a control), or the <b>internal auditor</b> (independent assurance). Then select <b>Check answers</b>.',
      hint: 'Look at the verb. Practitioners facilitate, analyze, recommend, monitor, escalate, and report. Risk owners choose responses and accept residual risk. Control owners run and evidence a control. Auditors sample, test, compare condition with criteria, and stay independent of what they test.',
      buckets: ['Risk practitioner', 'Risk owner', 'Control owner', 'Internal auditor'],
      review: { href: 'lesson00.html#s3', label: 'Lesson 0, The Practitioner’s Role' },
      items: [
        { text: 'I facilitated the outage workshop and drafted three response options, with costs, for the head of water operations.', answer: 0, why: 'Facilitating and recommending options is the practitioner’s core work. The choice among the options belongs to someone else.' },
        { text: 'I accept the residual risk of a billing platform outage until June, and I have signed the acceptance form.', answer: 1, why: 'Accepting residual risk is the risk owner’s decision. A signed, dated acceptance makes the accountability visible.' },
        { text: 'I run the weekly firewall rule review for the SCADA network and keep the evidence for each review.', answer: 2, why: 'Operating a control and keeping its evidence is the control owner’s job. The control owner may differ from the risk owner.' },
        { text: 'I sampled 25 user access removals and found 3 that were completed after the 24-hour standard.', answer: 3, why: 'Sampling to test whether a control operated is assurance work. It belongs to internal audit, which reports to the audit committee.' },
        { text: 'The outage scenario rose from 12 to 16 after the exploit was added to the KEV catalog, so I updated the register.', answer: 0, why: 'Keeping the register and risk profile current as threats change is a practitioner task.' },
        { text: 'I run meter-to-cash, so I decide whether we mitigate the billing fraud risk or transfer part of it through insurance.', answer: 1, why: 'The business process owner is usually the risk owner and selects the response. The practitioner advises on the options.' },
        { text: 'I report to the audit committee on whether the risk management process works. I had no part in designing it.', answer: 3, why: 'Independent, objective assurance on governance and risk management is the third line. Independence from the design is the point.' },
        { text: 'I perform the nightly backup job and the monthly restore test for the outage management system.', answer: 2, why: 'Running the backup and testing restores is control operation. The control owner reports results that feed key control indicators.' },
        { text: 'The KRI for unpatched field devices crossed its red threshold, so I am escalating it to the owner and the risk committee.', answer: 0, why: 'Monitoring KRIs and escalating breaches is the practitioner’s job. Escalation informs the people who decide; it does not decide for them.' },
        { text: 'I approve a 90-day exception to the password standard for the legacy meter reader, with compensating controls, as the accountable executive.', answer: 1, why: 'An exception is a temporary acceptance of risk. It needs a business reason, compensating controls, an expiry date, and the risk owner’s approval.' },
        { text: 'I administer the change approval workflow and confirm every production change has an approved ticket before release.', answer: 2, why: 'Operating the change approval step is control ownership. It is first-line work, not risk oversight or assurance.' },
        { text: 'My finding compares what the policy requires with what we observed, then rates how significant the gap is.', answer: 3, why: 'Criteria compared with condition is the structure of an audit finding. It is the auditor’s product.' }
      ]
    },
    {
      type: 'scenario', short: 'Best answer', title: 'FIRST, BEST, and MOST at Fernhollow', concept: 'best',
      instr: 'You are the risk practitioner at Fernhollow Utilities. Read the keyword in each question first, then choose the option a risk practitioner would choose.',
      hint: 'FIRST asks for understanding before action. BEST asks for the root cause, the business fit, and ownership kept where it belongs. GREATEST concern usually points at missing ownership, missing appetite, or unassessed risk before a missing technical control. Cross out any option where you make the owner’s decision.',
      review: { href: 'lesson00.html#s5', label: 'Lesson 0, Best-Answer Tactics' },
      items: [
        {
          title: 'Case 1: The sector advisory', text: 'The water sector information sharing center warns that a ransomware group is targeting utility billing service providers. Fernhollow outsources bill printing and payment processing to one such provider. The security team wants to buy a new endpoint product this week.',
          parts: [
            { q: 'What should the risk practitioner do FIRST?', options: ['Approve the endpoint purchase this week so protection is in place before the group reaches Fernhollow', 'Assess how the threat changes Fernhollow’s exposure through the billing provider', 'Require the billing provider to patch every system within 48 hours and send evidence of completion', 'Accept the risk, since the provider is responsible for its own security'], answer: 1, why: 'Assess before you respond. The practitioner updates the scenario and estimates exposure first, then brings options to the owner. Buying a tool first is the classic wrong answer.' }
          ]
        },
        {
          title: 'Case 2: Above appetite', text: 'An assessment rates unauthorized changes to water treatment setpoints at 18 on Fernhollow’s 5×5 scale. The board’s appetite statement says no residual risk above 12 may be accepted without risk committee approval. The VP of Water Operations owns the treatment process.',
          parts: [
            { q: 'What is the BEST next step for the risk practitioner?', options: ['Deploy application allowlisting on the treatment workstations right away, then re-rate the risk', 'Lower the rating to 12 because the controls planned for next year will bring it inside appetite', 'Inform the VP and require a response plan or a formal escalation to the risk committee', 'Accept the risk temporarily on the VP’s behalf until the next committee meeting'], answer: 2, why: 'When residual risk exceeds appetite, the practitioner informs the owner and requires a response or escalation. Changing the rating or accepting on someone’s behalf takes a decision that belongs to others.' },
            { q: 'If the VP wants to keep the risk at 18 with no further response, who must approve that?', concept: 'roles', options: ['The risk practitioner, because the practitioner rated it and maintains the register', 'The risk committee, because the risk is above the board’s appetite', 'The CISO, because the setpoints are controlled by computers', 'Internal audit, which will test the controls later'], answer: 1, why: 'Risk above appetite is beyond the owner’s authority to accept alone. The appetite statement routes it to the risk committee.' }
          ]
        },
        {
          title: 'Case 3: The register review', text: 'Fernhollow’s IT risk register has 40 entries. Of these, 11 list the owner as “IT Department,” 6 have no KRIs, 3 have ratings more than 18 months old, and 2 are duplicates.',
          parts: [
            { q: 'Which is the GREATEST concern?', options: ['The 2 duplicate entries', 'The 6 entries with no KRIs to signal a change in exposure', 'The 11 entries with no named individual owner', 'The 3 entries with ratings more than 18 months old'], answer: 2, why: 'A department cannot decide or accept. With no named owner, no one is accountable for a response, and the other defects cannot be fixed until someone owns the risk.' }
          ]
        },
        {
          title: 'Case 4: The board’s question', text: 'A new board member asks why every IT risk on Fernhollow’s register must name the business objective it affects.',
          parts: [
            { q: 'What is the PRIMARY reason?', options: ['So risks can be ranked by their effect on what the utility must achieve', 'So that external auditors can trace each risk to a specific control and test whether it works', 'So that IT can justify a larger security budget', 'So that the register matches the vendor’s template'], answer: 0, why: 'Risk is the effect of uncertainty on objectives. Linking each risk to an objective lets leaders compare and prioritize risks in business terms. The other benefits are secondary.' }
          ]
        },
        {
          title: 'Case 5: Choosing a response', text: 'Three responses are on the table for the risk of a meter data platform outage: a hot standby site, a vendor-managed cloud failover, and a manual workaround with paper reads.',
          parts: [
            { q: 'What is MOST important when the risk owner chooses among them?', options: ['Which option uses the most advanced technology and so will stay effective longest', 'Which option the platform vendor recommends', 'Which option brings the risk within appetite at a cost the risk reduction justifies', 'Which option has the lowest up-front cost, so funds stay free for other risks'], answer: 2, why: 'A response is judged by whether it brings risk within appetite, supports the business objective, and costs less than the risk it removes. Technology, vendor preference, and price alone are not the test.' }
          ]
        }
      ]
    },
    {
      type: 'order', short: 'Risk sequence', title: 'From a new concern to a managed risk', concept: 'process',
      instr: 'A field supervisor reports that Fernhollow’s new smart meters can be reached from the public internet. Put the steps of the risk management cycle in the order a risk practitioner would follow them. Use the arrow buttons to move each step.',
      hint: 'Criteria come before ratings, because you cannot evaluate a rating without appetite and scales. Identification comes before analysis. Evaluation against appetite comes before anyone chooses a response. The owner decides before anyone implements, and monitoring never really ends.',
      topLabel: 'First step',
      bottomLabel: 'Last step',
      review: { href: 'lesson00.html#s4', label: 'Lesson 0, The 24 Supporting Tasks' },
      items: [
        { text: 'Recommend response options, with costs, to the risk owner', rank: 4, why: 'The practitioner recommends once the risk is evaluated. Options without analysis are guesses.' },
        { text: 'Monitor the risk with KRIs and report status to stakeholders', rank: 7, why: 'Monitoring and reporting continue after the response is in place, and they feed the next cycle.' },
        { text: 'Confirm the context: business objectives affected, appetite, tolerance, and the rating scales', rank: 0, why: 'Context and criteria come first. Analysis without agreed criteria cannot be evaluated.' },
        { text: 'Analyze likelihood and impact of the scenario', rank: 2, why: 'Analysis estimates how likely and how harmful the scenario is, using the agreed scales.' },
        { text: 'The risk owner selects the response and accepts any residual risk', rank: 5, why: 'The owner decides. The practitioner’s recommendation informs the choice but does not make it.' },
        { text: 'Identify the risk: build a scenario from the threat, the exposed meters, and the business process', rank: 1, why: 'A scenario ties the technical exposure to an asset and a business consequence, so it can be analyzed.' },
        { text: 'Implement the action plan through change management, with task owners and due dates', rank: 6, why: 'Implementation follows the decision and runs through normal change control.' },
        { text: 'Evaluate the result against appetite and tolerance, and set its priority', rank: 3, why: 'Evaluation compares the analyzed risk with the criteria set at the start and decides how urgent it is.' }
      ]
    },
    {
      type: 'scenario', short: 'Ethics cases', title: 'The ISACA Code under pressure', concept: 'ethics',
      instr: 'You hold the CRISC and work as the risk practitioner at Fernhollow Utilities. Each case tests a theme of the ISACA Code of Professional Ethics, paraphrased in Lesson 0. Choose the <b>BEST</b> answer. Read the full Code at isaca.org.',
      hint: 'Report results fully, including unwelcome facts. Disclose conflicts of interest. Take on only work you are competent to do, and bring in help when you are not. Protect confidential information. Escalate inside the organization, through governance, before anything else, and never suppress a finding.',
      review: { href: 'lesson00.html#s3', label: 'Lesson 0, The ISACA Code of Professional Ethics' },
      items: [
        {
          title: 'Case 1: The green report', text: 'Before a public rate hearing, the CFO asks you to show overdue patching on the SCADA historian as “on track” in the quarterly risk report. She says the patches will be done by the end of next month.',
          parts: [
            { q: 'What should you do?', options: ['Show it as “on track,” since a plan exists and the CFO has committed to a fix date', 'Report it as overdue, include the CFO’s remediation date, and note her view', 'Leave the item out of this quarter’s report', 'Send the details to the state utility commission yourself'], answer: 1, why: 'Report results fully. The board sees the true status and the plan, so the CFO still gets credit for a fix. Suppression is wrong, and going straight to a regulator skips the governance path.' },
            { q: 'Which theme of the Code does this case test MOST directly?', options: ['Support professional education', 'Maintain competence', 'Report results fully, including significant unwelcome facts', 'Protect the confidentiality of information obtained in the course of your duties'], answer: 2, why: 'The request is to hide a significant fact from the people accountable for it. Full and accurate reporting is the theme at stake.' }
          ]
        },
        {
          title: 'Case 2: The bidder', text: 'You are asked to rate the third-party risk of three vendors bidding on Fernhollow’s new meter data management system. Your spouse is a sales director at one of the bidders.',
          parts: [
            { q: 'What is the BEST response?', options: ['Rate all three carefully; your professionalism will keep you objective', 'Rate only the two vendors your spouse does not work for', 'Disclose the conflict to your manager and ask someone else to rate the vendors', 'Mark your spouse’s company down slightly so no one can accuse you of favoritism'], answer: 2, why: 'Objectivity requires disclosing conflicts of interest. Stepping back protects the evaluation and you. Adjusting a rating in either direction is not objective.' }
          ]
        },
        {
          title: 'Case 3: Outside your field', text: 'The COO asks you to assess the risk of a new substation automation system by Friday. You have never worked with operational technology, and the safety stakes are high.',
          parts: [
            { q: 'What should you do FIRST?', options: ['Tell the COO about the gap and bring in OT engineering expertise while you facilitate', 'Complete the assessment alone using an IT checklist, then note your limits in an appendix', 'Decline the work and leave the assessment unassigned', 'Ask the vendor to perform the assessment of its own system'], answer: 0, why: 'Maintain competence means accepting work you can do well. The practitioner can still facilitate while qualified experts supply the OT judgment. A vendor assessing its own system is not objective.' }
          ]
        },
        {
          title: 'Case 4: The benchmarking request', text: 'A friend who manages risk at another utility asks you to email him Fernhollow’s latest penetration test report so he can compare results.',
          parts: [
            { q: 'What is the BEST response?', options: ['Send it, because sharing helps the whole sector', 'Send it with the IP addresses and asset names removed, since the sector benefits from sharing', 'Decline, and suggest sharing sanitized lessons through the ISAC with management approval', 'Read the key findings to him over the phone instead of sending the file'], answer: 2, why: 'Assessment results are confidential and must be used only for their purpose. Sector sharing is valuable, but it goes through authorized channels with management approval.' }
          ]
        },
        {
          title: 'Case 5: The rejected finding', text: 'Your analysis shows that chemical dosing alarms at the main treatment plant are routinely silenced during night shifts. The plant manager disagrees with the rating and refuses to put it on the register.',
          parts: [
            { q: 'What is the BEST next step?', options: ['Drop the finding, because the plant manager owns the process and decides on it', 'Document the disagreement and escalate it through risk governance, such as to the CRO', 'Report the plant to the state drinking water regulator', 'Reconfigure the alarms so they cannot be silenced, then document the change'], answer: 1, why: 'The finding stays on the record and goes up the governance path. Dropping it suppresses a significant fact, reporting externally skips governance, and changing the alarms takes the owner’s decision.' }
          ]
        }
      ]
    },
    {
      type: 'reflect', short: 'Reflect', title: 'Reflect on your readiness',
      instr: 'Rate your confidence on each concept, then answer the prompts. Your responses appear in the summary report.',
      prompts: [
        { key: 'shift', label: 'Think of a recent decision you made as an instructor, auditor, or engineer. How would a risk practitioner have framed it, and who would have made the final call?' },
        { key: 'next', label: 'Which concept from this activity will you review before the next lesson, and how?' }
      ]
    }
  ]
};

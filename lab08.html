<style>
/* ===== Lab B8: ransomware tabletop facilitation (scoped b8-) ===== */
.b8-modes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .6rem; margin: 0 0 1rem; }
.b8-mode { text-align: left; border: 1px solid var(--border); background: var(--card-bg); border-radius: 4px; padding: .7rem .85rem; cursor: pointer; font: .82rem/1.45 Arial, sans-serif; color: var(--text-secondary); }
.b8-mode b { display: block; font: 700 .95rem Georgia, serif; color: var(--text-primary); margin-bottom: .15rem; }
.b8-mode:hover { border-color: var(--gold); }
.b8-mode[aria-pressed="true"] { border-color: var(--navy); box-shadow: inset 0 0 0 2px var(--navy); background: var(--blue-pale); }
.b8-mode[aria-pressed="true"] b::after { content: " (selected)"; font: 700 .7rem Arial, sans-serif; color: var(--navy); letter-spacing: .04em; }
.b8-mode:focus-visible, .b8-btnrow .btn:focus-visible, .b8-seg button:focus-visible, .b8-opt:focus-within, .b8-wi button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.b8-bar { display: flex; flex-wrap: wrap; gap: .6rem 1rem; align-items: center; padding: .75rem .9rem; border: 1px solid var(--blue-pale-border); background: var(--blue-pale); border-radius: 4px; margin-bottom: 1rem; font: .88rem Arial, sans-serif; color: var(--text-secondary); }
.b8-bar .b8-simclk { font: 900 1.4rem 'Arial Narrow', Arial, sans-serif; color: var(--navy); letter-spacing: .02em; }
.b8-btnrow { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; }
.b8-seg { display: inline-flex; gap: .3rem; flex-wrap: wrap; }
.b8-seg button { border: 1px solid var(--border); background: var(--card-bg); color: var(--text-secondary); border-radius: 4px; padding: .45rem .8rem; font: 700 .82rem Arial, sans-serif; cursor: pointer; }
.b8-seg button[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
.b8-lbl { display: block; font: 700 .7rem Arial, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--text-muted); }

/* Facilitator / team board (projector) */
.b8-board { border: 2px solid var(--navy); border-radius: 6px; background: #fff; padding: 1.1rem 1.3rem 1.2rem; margin-bottom: 1.1rem; }
.b8-b-top { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 1rem 1.6rem; align-items: start; padding-bottom: .9rem; border-bottom: 1px solid var(--border); }
.b8-code { display: block; font: 700 3.4rem/1.05 'Courier New', monospace; letter-spacing: .08em; color: var(--navy); margin: .2rem 0 .3rem; }
.b8-codenote { display: block; font: 700 .9rem/1.45 Arial, sans-serif; color: var(--navy); background: var(--gold-pale); border: 1px solid var(--gold); border-left-width: 5px; border-radius: 3px; padding: .35rem .6rem; }
.b8-codenote.calm { color: var(--text-secondary); background: var(--blue-pale); border-color: var(--blue-pale-border); border-left-width: 1px; }
.b8-clock { display: block; font: 900 3.2rem/1.05 'Arial Narrow', Arial, sans-serif; color: var(--text-primary); margin: .2rem 0 .25rem; }
.b8-clock-sub { display: block; font: 700 1.05rem/1.4 Arial, sans-serif; color: var(--text-secondary); }
.b8-state { display: inline-block; font: 700 .78rem Arial, sans-serif; letter-spacing: .08em; text-transform: uppercase; border-radius: 3px; padding: .15rem .5rem; margin-left: .4rem; vertical-align: middle; border: 1px solid var(--navy); color: var(--navy); }
.b8-state.paused { border-color: var(--amber); color: var(--jade-dark); background: var(--jade-pale); }
.b8-cur { padding: 1rem 0 .4rem; }
.b8-cur .b8-cur-meta { font: 700 1rem Arial, sans-serif; color: var(--navy-light); letter-spacing: .04em; }
.b8-cur h3 { font: 700 1.9rem/1.2 Georgia, serif; color: var(--text-primary); margin: .25rem 0 .5rem; }
.b8-cur p { font: 1.15rem/1.55 Arial, sans-serif; color: var(--text-secondary); margin: 0 0 .6rem; max-width: 72ch; }
.b8-cur ol.b8-cur-opts { list-style: none; margin: .4rem 0 .5rem; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .5rem .9rem; }
.b8-cur ol.b8-cur-opts li { font: 1.08rem/1.45 Arial, sans-serif; color: var(--text-primary); border: 1px solid var(--blue-pale-border); background: var(--blue-pale); border-radius: 4px; padding: .5rem .7rem; }
.b8-cur ol.b8-cur-opts li b { font: 900 1.2rem 'Arial Narrow', Arial, sans-serif; color: var(--navy); margin-right: .35rem; }
.b8-cur .b8-ask { font: 700 1.1rem Georgia, serif; color: var(--navy); margin: .3rem 0 .2rem; }
.b8-board .b8-btnrow { padding-top: .8rem; border-top: 1px solid var(--border); }
.b8-board.team .b8-code { font-size: 1.6rem; }
.b8-board.team .b8-clock { font-size: 2.2rem; }
.b8-board.team .b8-cur h3 { font-size: 1.4rem; }
.b8-board.team .b8-cur p { font-size: .98rem; }
.b8-prev { font: .8rem Arial, sans-serif; color: var(--text-muted); margin: .4rem 0 0; }
.b8-join { display: flex; flex-wrap: wrap; gap: .6rem; align-items: flex-end; margin-bottom: .8rem; }
.b8-join label { display: block; font: 700 .9rem Georgia, serif; color: var(--text-primary); margin-bottom: .3rem; }
.b8-join input { font: 700 1.3rem 'Courier New', monospace; letter-spacing: .1em; text-transform: uppercase; width: 11rem; padding: .45rem .6rem; border: 1px solid var(--border); border-radius: 4px; color: var(--text-primary); }
.b8-join input:focus { border-color: var(--gold); outline: none; box-shadow: 0 0 0 3px var(--gold-pale); }
.b8-err { font: 700 .88rem Arial, sans-serif; color: var(--wrong); margin: 0 0 .8rem; }
.b8-warn { font: .88rem Arial, sans-serif; color: var(--text-primary); background: var(--jade-pale); border-left: 4px solid var(--amber); padding: .5rem .7rem; margin: 0 0 .8rem; }
.b8-board:fullscreen { box-sizing: border-box; width: 100vw; height: 100vh; border: 0; border-radius: 0; padding: 3.5vh 4vw; display: flex; flex-direction: column; overflow: hidden; }
.b8-board:fullscreen .b8-code { font-size: min(9vh, 6vw); }
.b8-board:fullscreen .b8-clock { font-size: min(9vh, 6vw); }
.b8-board:fullscreen .b8-clock-sub, .b8-board:fullscreen .b8-codenote { font-size: min(2.5vh, 1.6vw); }
.b8-board:fullscreen .b8-cur { flex: 1; min-height: 0; overflow: hidden; }
.b8-board:fullscreen .b8-cur h3 { font-size: min(4.6vh, 3vw); }
.b8-board:fullscreen .b8-cur p { font-size: min(2.6vh, 1.7vw); max-width: none; }
.b8-board:fullscreen .b8-cur ol.b8-cur-opts li { font-size: min(2.5vh, 1.6vw); }
.b8-board:fullscreen .b8-cur .b8-cur-meta, .b8-board:fullscreen .b8-cur .b8-ask { font-size: min(2.5vh, 1.6vw); }

/* Impact clock */
.b8-ic { border: 1px solid var(--border); border-radius: 4px; padding: .9rem 1rem 1rem; margin-bottom: 1.1rem; background: var(--card-bg); }
.b8-ic h4 { font: 700 1rem Georgia, serif; color: var(--text-primary); margin: 0 0 .2rem; }
.b8-ic .b8-ic-sum { font: .86rem/1.55 Arial, sans-serif; color: var(--text-secondary); margin: .1rem 0 .7rem; }
.b8-tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .6rem; margin-bottom: .8rem; }
.b8-tile { border: 1px solid var(--blue-pale-border); background: var(--blue-pale); border-radius: 4px; padding: .55rem .7rem .6rem; }
.b8-tile .v { display: block; font: 900 1.75rem/1.1 'Arial Narrow', Arial, sans-serif; color: var(--navy); }
.b8-tile .u { font: 700 .8rem Arial, sans-serif; color: var(--text-secondary); margin-left: .2rem; }
.b8-tile .dl { display: block; font: 700 .74rem Arial, sans-serif; color: var(--text-muted); margin-top: .15rem; min-height: 1em; }
.b8-tile .dl.up { color: var(--wrong); } .b8-tile .dl.good { color: var(--correct); }
.b8-meter { height: 8px; background: #fff; border: 1px solid var(--blue-pale-border); border-radius: 4px; overflow: hidden; margin-top: .35rem; }
.b8-meter i { display: block; height: 100%; background: var(--navy-light); }
.b8-chart { width: 100%; height: auto; display: block; }
.b8-chart text { font: 11px Arial, sans-serif; fill: #6c5669; }
.b8-chart .ax { stroke: #e3d2e1; stroke-width: 1; }
.b8-chart .grid { stroke: #f3e9f2; stroke-width: 1; }
.b8-chart .ln { fill: none; stroke: #3b1838; stroke-width: 2.5; }
.b8-chart .ln2 { fill: none; stroke: #b45309; stroke-width: 2.5; stroke-dasharray: 7 5; }
.b8-chart .pt { fill: #3b1838; } .b8-chart .pt2 { fill: #fff; stroke: #b45309; stroke-width: 2; }
.b8-chart .lbl { font-weight: 700; fill: #3b1838; } .b8-chart .lbl2 { font-weight: 700; fill: #92400e; }
.b8-legend { font: .78rem Arial, sans-serif; color: var(--text-secondary); margin: .2rem 0 .4rem; display: flex; gap: 1.2rem; flex-wrap: wrap; }
.b8-legend span::before { content: ""; display: inline-block; width: 26px; height: 0; border-top: 3px solid #3b1838; vertical-align: middle; margin-right: .35rem; }
.b8-legend span.wi::before { border-top: 3px dashed #b45309; }

/* Inject feed and decisions */
.b8-feed { display: grid; gap: .8rem; }
.b8-inj { border: 1px solid var(--border); border-left: 4px solid var(--navy); border-radius: 0 4px 4px 0; padding: .8rem 1rem .9rem; background: var(--card-bg); }
.b8-inj.newest { border-left-color: var(--gold); }
.b8-inj-h { font: 700 .74rem Arial, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); }
.b8-inj h5 { font: 700 1.02rem Georgia, serif; color: var(--text-primary); margin: .2rem 0 .4rem; }
.b8-inj p { font: .88rem/1.6 Arial, sans-serif; color: var(--text-secondary); margin: 0 0 .5rem; }
.b8-inj p b { color: var(--text-primary); }
.b8-dec { border-top: 1px dashed var(--border); padding-top: .6rem; margin-top: .3rem; }
.b8-dec fieldset { border: 0; margin: 0; padding: 0; }
.b8-dec legend { font: 700 .72rem Arial, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); margin-bottom: .35rem; }
.b8-opt { display: flex; gap: .5rem; align-items: flex-start; border: 1px solid var(--border); border-radius: 4px; padding: .45rem .6rem; margin-bottom: .35rem; font: .86rem/1.45 Arial, sans-serif; color: var(--text-primary); cursor: pointer; background: #fff; }
.b8-opt:hover { border-color: var(--gold); }
.b8-opt input { margin-top: .2rem; }
.b8-opt b { color: var(--navy); }
.b8-opt.mine { border-color: var(--navy); box-shadow: inset 0 0 0 1px var(--navy); background: var(--blue-pale); cursor: default; }
.b8-opt.dim { opacity: .62; cursor: default; }
.b8-tag { font: 700 .66rem Arial, sans-serif; letter-spacing: .06em; text-transform: uppercase; border-radius: 3px; padding: .05rem .35rem; border: 1px solid var(--navy); color: var(--navy); white-space: nowrap; background: #fff; }
.b8-res { border-left: 4px solid var(--navy-light); background: var(--blue-pale); padding: .55rem .75rem; margin-top: .5rem; font: .86rem/1.55 Arial, sans-serif; color: var(--text-primary); }
.b8-res .fx { display: block; font: 700 .78rem Arial, sans-serif; color: var(--text-secondary); margin-top: .3rem; }
.b8-empty { font: .9rem Arial, sans-serif; color: var(--text-muted); border: 1px dashed var(--border); border-radius: 4px; padding: 1rem; text-align: center; }
.b8-pending { font: .82rem Arial, sans-serif; color: var(--text-muted); margin: .3rem 0 0; }
.b8-h4 { font: 700 1.05rem Georgia, serif; color: var(--text-primary); margin: 1.2rem 0 .6rem; }

/* What-if replay */
.b8-wi { border: 1px solid var(--border); border-radius: 4px; padding: .9rem 1rem 1rem; margin-top: 1.1rem; background: var(--card-bg); }
.b8-wi-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .4rem 1rem; align-items: center; padding: .35rem 0; border-bottom: 1px solid var(--section-alt); font: .85rem Arial, sans-serif; color: var(--text-primary); }
.b8-wi-row .b8-seg button { min-width: 2.6rem; }
.b8-wi-row .b8-seg button.yours { border-style: dashed; border-color: var(--navy); }
.b8-wi table.data td.num, .b8-wi table.data th.num { text-align: right; }
@media (max-width: 760px) {
  .b8-modes { grid-template-columns: 1fr; }
  .b8-b-top { grid-template-columns: 1fr; }
  .b8-code { font-size: 2.4rem; }
  .b8-clock { font-size: 2.4rem; }
  .b8-cur h3 { font-size: 1.35rem; }
  .b8-cur p { font-size: 1rem; }
  .b8-cur ol.b8-cur-opts { grid-template-columns: 1fr; }
  .b8-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .b8-wi-row { grid-template-columns: 1fr; }
}
@media print { .b8-path-wrap { break-inside: avoid; } }

<script>
/* ===================== Scenario, consequence model, and session-code engine =====================
   Ironvale Health Partners: a ransomware tabletop exercise that you facilitate as the risk
   practitioner (CRISC Task 24). Eight injects. At each one you choose a facilitation or advisory
   move. Each move carries a deterministic consequence for the scenario as the room plays it
   (projected downtime hours, patient records exposed in thousands, direct cost in $K, and an
   exercise value index). A few moves set flags that change the consequence of a later inject.
   Disruption is priced per downtime hour. */
(function () {
  var BASE = { h: 6, m: 10 }; // T+0:00 = Monday 06:10 in the scenario
  var DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  var BI_RATE = 25; // $K of disruption per downtime hour (diversions, delayed procedures, overtime)
  var LETTERS = 'ABCD';
  function o(t, dt, ex, cost, rep, res, flag) { return { t: t, d: { dt: dt, ex: ex, cost: cost, rep: rep }, res: res, flag: flag || null }; }
  var INJECTS = [
    { id: 'I1', t: 0, title: 'Encryption alerts on the imaging servers', refs: 'Exercise plan 3 (ground rules), IRP 2.1', best: 2, step: 'Declaration',
      base: { dt: 8, ex: 30, cost: 60, rep: 0 },
      sit: 'Scenario time Monday 06:10. The SOC reports EDR alerts for mass file encryption on two radiology imaging servers at Ironvale North Hospital, and a VPN sign-in by a vendor support account at 02:40. In the room, the infrastructure manager starts a detailed walk-through of the EDR console. Twelve minutes pass. Nobody has said whether this is an incident, and the CIO is waiting for someone else to call it.',
      ask: 'As facilitator, what do you do?',
      opts: [
        o('Declare the incident yourself so the exercise keeps moving, then release the next inject.', 4, 10, 30, -8, 'The room moves on, but the exercise never tests who holds declaration authority. Two executives each believe the other declares incidents, and nobody notices until the after-action review.', 'decided'),
        o('Let the technical walk-through finish, because the detail will help with the later injects.', 10, 20, 70, -6, 'The walk-through takes 25 minutes of a 90-minute exercise. In the scenario, encryption spreads while the room talks, and the declaration objective is left untested.', 'late'),
        o('Pause the walk-through, ask who declares under the IRP, and have that person decide.', 0, 0, 10, 0, 'The CIO reads IRP 2.1, confirms the declaration authority is hers, and declares a Severity 1 incident at scenario time 06:25. The scribe records the time and the decision maker. Objective O1 is now being tested as written.'),
        o('Skip ahead to the ransom demand inject, since that is where the hard decisions are.', 6, 14, 40, -10, 'The room jumps to ransom before anyone has declared, contained, or escalated. The first hour, where real incidents most often go wrong, is never exercised.')
      ] },
    { id: 'I2', t: 90, title: 'The EHR goes down at all three hospitals', refs: 'Appetite statement, IRP 3.1', best: 0, step: 'Escalation',
      base: { dt: 10, ex: 0, cost: 80, rep: 0 },
      sit: 'Scenario time 07:40. The EHR is unavailable at North, Central, and Lakeside hospitals, and the emergency departments have started downtime procedures. The COO, who owns clinical operations risk, proposes waiting until the noon leadership huddle before telling the CEO. The appetite statement is in everyone’s packet.',
      ask: 'What is your facilitation move?',
      opts: [
        o('Ask the COO to check the outage against the tolerance in the appetite statement and decide.', 0, 0, 10, 0, 'The COO reads the tolerance aloud: an EHR outage over 4 hours at more than one hospital is outside appetite and goes to the CEO and the board risk committee chair within 1 hour. She escalates at 07:50. The scribe notes that nobody knew the threshold before reading it, which becomes a finding.'),
        o('Call the board risk committee chair yourself, because the outage is plainly outside appetite.', 2, 0, 40, -8, 'The escalation happens, but the practitioner made it, not the risk owner. The exercise records an escalation path that does not exist in the plan, and the COO’s role is never tested.', 'decided'),
        o('Accept the COO’s plan to wait for noon, since the risk owner is entitled to decide.', 8, 0, 90, -6, 'The owner decides, but without the tolerance in front of her. In the scenario, the CEO first hears of the outage from a news crew outside the North emergency department. The objective is marked not met, with no record of why.', 'late'),
        o('Stop the exercise and give a short briefing on risk appetite and risk tolerance.', 4, 0, 50, -5, 'Ten minutes of teaching replaces the decision. The room learns the definitions but never practices using them under pressure, and the inject runs out of time.')
      ] },
    { id: 'I3', t: 180, title: 'Downtime procedures stall', refs: 'Exercise plan 3, BIA summary', best: 3, step: 'Capturing findings',
      base: { dt: 12, ex: 0, cost: 90, rep: 0 },
      sit: 'Scenario time 09:10. The nursing director reports that the paper downtime forms are the 2021 version and lack the current medication reconciliation fields. Pharmacy can verify only about 40 percent of normal orders by hand. The BIA sets an MTD of 8 hours for medication ordering. The room starts redesigning the form on the whiteboard, and one participant asks who let the forms go out of date.',
      ask: 'How do you handle this in the room?',
      opts: [
        o('Let the room finish the redesign, since a fixed form is the most useful outcome of the day.', 6, 0, 80, -7, 'The redesign takes 30 minutes. Two objectives are left untested, and the whiteboard form is never reviewed by pharmacy.'),
        o('Ask the nursing director to explain why the forms were not updated, so the cause is on record.', 4, 0, 60, -9, 'The question lands as blame. The nursing director goes quiet for the rest of the session, and later participants hedge their answers. A no-fault exercise only works when people can admit gaps.', 'blame'),
        o('Note that forms are operational detail and move on, because the objectives are about decisions.', 8, 0, 100, -6, 'The gap disappears from the record. In the scenario, medication ordering stays at 40 percent past the 8-hour MTD, and nobody owns the fix.', 'lost'),
        o('Have the scribe log it as a finding against the MTD, park the fix, and keep time.', 0, 0, 20, 0, 'The scribe logs the finding: downtime forms out of date, manual medication ordering at 40 percent against an 8-hour MTD. The CNO is named as the likely owner, and the exercise moves on with time left for every objective.')
      ] },
    { id: 'I4', t: 360, title: 'The lab-results vendor reports a compromise', refs: 'Register R-11, notification matrix', best: 1, step: 'Third-party obligations',
      base: { dt: 4, ex: 18, cost: 70, rep: 0 },
      sit: 'Scenario time 12:10. Corvane Diagnostics Network, which hosts Ironvale’s lab-results interface, emails that the same group compromised its support platform and may have accessed result files. Corvane is a business associate under a BAA. The vendor manager thinks the BAA requires notice “within a reasonable time.” Register entry R-11 rates the interface as low residual risk, based on a 2025 questionnaire.',
      ask: 'What do you do as facilitator?',
      opts: [
        o('Tell the room the BAA almost certainly requires notice within 60 days, and move on.', 2, 6, 90, -6, 'The room accepts your guess, so nobody checks the contract. The after-action report has no finding on the BAA terms, and the real notice clause is never read.', 'decided'),
        o('Hand out the BAA extract and ask the vendor manager and privacy officer what it requires.', 0, 0, 20, 0, 'The extract shows Corvane must report a breach of unsecured PHI within 10 days of discovery, but it says nothing about Corvane’s own subcontractors. The scribe logs two findings: the fourth-party gap, and an R-11 rating that rests on a questionnaire instead of evidence.'),
        o('Treat the vendor issue as out of scope, because the exercise is about Ironvale’s own systems.', 6, 20, 140, -7, 'The third-party path stays untested. In the scenario, Ironvale learns weeks later, from a patient complaint, that lab results were exposed through Corvane.', 'lost'),
        o('Ask the CIO to decide right now whether to cut the Corvane interface.', 8, 0, 110, -4, 'The CIO cuts the interface without the lab director, who owns the process. Lab results stop reaching the emergency departments for the rest of the scenario, and the decision right is still unclear.')
      ] },
    { id: 'I5', t: 1080, title: 'Ransom demand and a leak-site post', refs: 'IRP 5.2, Exercise plan 4 (roles)', best: 3, step: 'Decision rights',
      base: { dt: 6, ex: 25, cost: 120, rep: -4 },
      sit: 'Scenario time Tuesday 00:10. The group demands $4.5 million and posts 200 patient records on its leak site as proof. The CFO turns to you: “You’re the risk person. Should we pay?” IRP 5.2 gives payment decisions to the CEO with the board, on counsel’s advice, after sanctions screening and an insurer consent check. Immutable backups exist but have not been restore-tested this year.',
      ask: 'How do you respond to the CFO?',
      opts: [
        o('Recommend paying, because the backups are untested and patient care has to come first.', -2, 10, 4600, -10, 'The room follows your lead and agrees to pay. Nobody checks sanctions, insurer consent, or whether the backups would work. The exercise records a decision made by the facilitator, which no plan allows.'),
        o('Say that Ironvale never pays, and release the next inject to stay on time.', 4, 0, 60, -5, 'The answer sounds firm, but it is your policy, not the CEO’s decision. The room never works through backup viability, sanctions screening, or insurer consent, which were the point of the inject.', 'decided'),
        o('Ask the CFO to make the call now, since the CFO owns financial risk.', 2, 0, 80, -6, 'The CFO decides, but IRP 5.2 gives this decision to the CEO with the board. The exercise rehearses the wrong decision path, and the scribe records it as if it were correct.'),
        o('Say the CEO decides with the board, and ask counsel and the CIO for the IRP inputs.', 0, 0, 30, 0, 'The CEO takes the decision. Counsel lists sanctions screening and insurer consent; the CIO says the immutable backups have not been restore-tested this year. The CEO decides not to pay while recovery from backup is viable, and the scribe logs the untested backups as a finding.')
      ] },
    { id: 'I6', t: 1200, title: 'Who owns the notification clock?', refs: 'Notification matrix, IRP 5.3', best: 0, step: 'Regulatory obligations',
      base: { dt: 2, ex: 0, cost: 60, rep: 0 },
      sit: 'Scenario time Tuesday 02:10. The general counsel says notification can wait until forensics proves data was taken. The privacy officer is not sure. The notification matrix in the exercise packet summarizes the HIPAA Breach Notification Rule. The leak-site post already includes patient names and diagnoses.',
      ask: 'What is your facilitation move?',
      opts: [
        o('Ask the privacy officer to walk the matrix: who owns the clock, discovery, and deadlines.', 0, 0, 20, 0, 'The privacy officer explains that HHS treats ransomware affecting PHI as a presumed breach unless a documented risk assessment shows a low probability of compromise, and the leak-site post rules that out. She records discovery as Monday 06:25 and lists the deadlines. The scribe logs that counsel and privacy disagreed on the trigger, a finding for training.'),
        o('Agree with counsel, since legal owns notification and the facilitator should not second-guess.', 0, 0, 150, -8, 'Deferring to the owner is usually right, but letting a plain gap pass is not. The room plans to wait for forensics, which the presumption of breach does not allow, and the gap never reaches the report.'),
        o('Tell the room that encrypted data is not a breach, so no notice is needed here.', 0, 0, 260, -12, 'This is wrong, and it comes from the facilitator. Under HHS guidance, ransomware that encrypts PHI is a presumed breach unless a risk assessment shows a low probability of compromise. The room leaves with a false belief.'),
        o('Ask communications to draft a notice to all patients today, before the scope is known.', 0, 0, 120, -5, 'The room drafts a notice before anyone knows who was affected. It names the wrong hospitals, and in the scenario it has to be corrected the next day.')
      ] },
    { id: 'I7', t: 2400, title: 'Restore from the immutable backups', refs: 'Register R-07, BIA summary', best: 2, step: 'Register reality check',
      base: { dt: 24, ex: 0, cost: 150, rep: 0 },
      sit: 'Scenario time Tuesday 22:10. The CIO reports that the immutable backups are intact, but the newest EHR copy is 26 hours old and a full restore will take about 30 hours. The BIA sets an RTO of 24 hours and an RPO of 4 hours for the EHR. Register entry R-07, EHR recoverability, rates residual risk as low and cites “daily immutable backups.” No restore has been tested since 2025.',
      ask: 'What do you do with this in the exercise?',
      opts: [
        o('Rule that the restore succeeds on time, so the exercise ends on a positive note.', 10, 0, 120, -9, 'The room relaxes, and the exercise hides its most important result. R-07 stays rated low, and the RTO and RPO gaps go unreported.', 'lost'),
        o('Open a design discussion on a new backup architecture before the exercise moves on.', 20, 0, 260, -5, 'Forty minutes go to vendor options. The closing inject is cut short, and the redesign has no owner or budget.'),
        o('Log the RTO and RPO gaps against R-07 and have the CIO confirm the facts.', 0, 0, 40, 0, 'The CIO, as control owner, confirms both gaps: about 30 hours to restore against a 24-hour RTO, and data 26 hours old against a 4-hour RPO. The scribe links the finding to R-07, whose low residual rating rested on a control nobody had tested.'),
        o('Ask the COO to accept the gap as residual risk on the spot.', 6, 0, 90, -6, 'Acceptance without analysis is not acceptance. The COO agrees under time pressure, and the report records a risk decision that nobody costed or compared with appetite.')
      ] },
    { id: 'I8', t: 4320, title: 'Time is up: the hot wash', refs: 'Exercise plan 6 (after-action)', best: 1, step: 'After-action follow-through',
      base: { dt: 6, ex: 0, cost: 40, rep: 0 },
      sit: 'The exercise is at 85 of 90 minutes and the last inject is done. The CEO thanks everyone and suggests skipping the hot wash: “We all saw what happened. Send a summary when you can.” The scribe’s log holds several findings. Three involve risk register entries, and two register KRIs have no data source.',
      ask: 'What do you recommend?',
      opts: [
        o('Skip the hot wash, and send a short summary email to participants next week.', 12, 0, 160, -9, 'Memories fade, and the summary lists events, not gaps. No corrective action gets an owner, and the next real incident meets the same out-of-date forms and untested restores.'),
        o('Run a 15-minute hot wash now, then issue the after-action report with owners.', 0, 0, 20, 0, 'The hot wash adds two findings the scribe missed. Within ten business days, the after-action report goes to the risk committee with corrective actions, owners, and due dates, and the register and KRI updates enter the risk action plan.'),
        o('Send the findings to internal audit and let audit decide which ones matter.', 6, 0, 90, -6, 'Audit can evaluate, but it does not own the response, and it should stay independent of it. The findings sit in an audit queue, and the risk owners never commit to actions.'),
        o('Publish the scribe’s log with the names of the people whose answers were wrong.', 4, 0, 70, -12, 'The log is accurate, and the damage lasts. The next tabletop has half the attendance, and nobody volunteers a gap.')
      ] }
  ];
  var SIM_END = 4800;

  /* Consequence of committing option c at inject k, given the other committed decisions */
  function effect(k, c, dec) {
    var op = INJECTS[k].opts[c], d = { dt: op.d.dt, ex: op.d.ex, cost: op.d.cost, rep: op.d.rep }, notes = [];
    function has(f) { for (var j = 0; j < k; j++) if (dec[j] != null && INJECTS[j].opts[dec[j]].flag === f) return true; return false; }
    if (k === 3 && has('blame')) { d.cost += 40; d.rep -= 4; notes.push('After the blame at Inject 3, the vendor manager hedges instead of admitting what she does not know: +$40K and 4 fewer exercise value points.'); }
    if (k === 4 && has('decided')) { d.cost += 150; d.rep -= 4; notes.push('Earlier, the facilitator made a decision for the room, so the decision owners now wait for you instead of using the plan: +$150K and 4 fewer exercise value points.'); }
    if (k === 5 && has('late')) { d.cost += 60; d.rep -= 4; notes.push('The late declaration or escalation earlier leaves the discovery time in dispute, so the notification clock is unclear: +$60K and 4 fewer exercise value points.'); }
    if (k === 7 && has('lost')) { d.dt += 18; notes.push('Gaps that were waved off earlier never reach the report, so the projected real incident keeps them: +18 downtime hours.'); }
    return { d: d, notes: notes };
  }

  /* Totals after `count` injects released with decisions `dec` (array of option index or null) */
  function model(dec, count) {
    var n = count == null ? 8 : count, T = { dt: 0, ex: 0, cost: 0, rep: 100 }, steps = [], decided = 0;
    for (var k = 0; k < n; k++) {
      var b = INJECTS[k].base; T.dt += b.dt; T.ex += b.ex; T.cost += b.cost; T.rep += b.rep;
      if (dec[k] != null) { var e = effect(k, dec[k], dec).d; T.dt += e.dt; T.ex += e.ex; T.cost += e.cost; T.rep += e.rep; decided++; }
      steps.push({ dt: T.dt, ex: T.ex, cost: T.cost, total: T.cost + BI_RATE * T.dt, rep: T.rep, decided: dec[k] != null });
    }
    return { dt: T.dt, ex: T.ex, cost: T.cost, total: T.cost + BI_RATE * T.dt, rep: Math.max(0, T.rep), steps: steps, decided: decided };
  }
  var BEST = INJECTS.map(function (x) { return x.best; });

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function hm(min) { min = Math.max(0, Math.floor(min)); return Math.floor(min / 60) + ':' + pad(min % 60); }
  function tplus(min) { return 'T+' + hm(min); }
  function wall(min) { var tot = BASE.h * 60 + BASE.m + Math.floor(min), d = Math.floor(tot / 1440), r = tot % 1440; return DAYS[Math.min(d, DAYS.length - 1)] + ' ' + pad(Math.floor(r / 60)) + ':' + pad(r % 60); }
  function money(k) { return '$' + (k / 1000).toFixed(2) + 'M'; }

  /* ---------- Session code (own lab tag) ----------
     30 payload bits in 6 Crockford base32 characters + 1 checksum character.
     tag(2) | interval(2) | paused(1) | inject index(3) | anchor(22).
     Running: anchor = start epoch second of the current inject window, mod 2^22.
     Paused: anchor = seconds already elapsed in the current inject window. */
  var ALPHA = '0123456789ABCDEFGHJKMNPQRSTVWXYZ', M = 4194304, TAG = 1, IVS = [300, 420, 600];
  function checksum(vals) { var s = 19; /* CRISC-specific seed: CISSP codes fail the check */ vals.forEach(function (v, i) { s += (2 * i + 1) * v; }); return s % 32; }
  function encode(st) {
    var a = ((Math.floor(st.anchor) % M) + M) % M;
    var v = (((TAG * 4 + st.iv) * 2 + (st.paused ? 1 : 0)) * 8 + st.b) * M + a, ch = [];
    for (var i = 5; i >= 0; i--) { ch[i] = v % 32; v = Math.floor(v / 32); }
    ch.push(checksum(ch));
    return ch.map(function (c) { return ALPHA[c]; }).join('');
  }
  function fmtCode(c) { return c.slice(0, 3) + '-' + c.slice(3); }
  function clean(s) { return String(s || '').toUpperCase().replace(/[\s\-_.]/g, '').replace(/O/g, '0').replace(/[IL]/g, '1').replace(/U/g, 'V'); }
  function resolve(a, nowSec) { var c = nowSec - (((nowSec - a) % M) + M) % M; if (nowSec - c > M / 2) c += M; return c; }
  function decode(raw, nowSec) {
    var s = clean(raw);
    if (!s) return { error: 'Enter the session code shown on the projector.' };
    if (s.length !== 7) return { error: 'Session codes have 7 characters, such as K7Q-4MZP. You entered ' + s.length + '.' };
    var vals = [];
    for (var i = 0; i < 7; i++) { var k = ALPHA.indexOf(s[i]); if (k < 0) return { error: 'The code contains a character that session codes do not use: ' + s[i] + '.' }; vals.push(k); }
    if (checksum(vals.slice(0, 6)) !== vals[6]) return { error: 'That code does not check out. One character is probably mistyped. Compare it with the projector and try again.' };
    var v = 0; for (i = 0; i < 6; i++) v = v * 32 + vals[i];
    var a = v % M, r = Math.floor(v / M), b = r % 8; r = Math.floor(r / 8); var p = r % 2; r = Math.floor(r / 2); var iv = r % 4, tag = Math.floor(r / 4);
    if (tag !== TAG || iv > 2) return { error: 'That is not a session code for this lab. Ask the facilitator for the CRISC Lab B8 code.' };
    var st = { code: s, b: b, paused: !!p, iv: iv };
    if (p) { st.within = a; if (a > IVS[iv]) return { error: 'That code is not valid. Ask the facilitator for the current code.' }; }
    else st.t0 = resolve(a, nowSec);
    return { state: st };
  }
  function derive(st, nowSec) {
    var I = IVS[st.iv], idx, within, nextIn = null;
    if (st.paused) { idx = st.b; within = st.within || 0; }
    else {
      var el = Math.max(0, nowSec - st.t0), steps = Math.floor(el / I);
      idx = Math.min(7, st.b + steps);
      within = el - (idx - st.b) * I;
      if (idx < 7) nextIn = I - within;
    }
    var w = Math.min(within, I), nextT = idx < 7 ? INJECTS[idx + 1].t : SIM_END;
    var sim = INJECTS[idx].t + (nextT - INJECTS[idx].t) * w / I;
    return { idx: idx, count: idx + 1, within: within, nextIn: nextIn, sim: sim, closed: idx === 7 && within >= I, I: I };
  }

  window.B8 = {
    INJECTS: INJECTS, BEST: BEST, BI_RATE: BI_RATE, LETTERS: LETTERS, IVS: IVS, ALPHA: ALPHA, M: M, TAG: TAG,
    hm: hm, tplus: tplus, wall: wall, money: money, effect: effect, model: model,
    encode: encode, decode: decode, derive: derive, fmtCode: fmtCode, clean: clean, checksum: checksum,
    answers: {
      bestDowntime: function () { return model(BEST, 8).dt; },
      bestCostM: function () { return Math.round(model(BEST, 8).total) / 1000; }
    }
  };
})();
</script>

<script>
(function () {
  var B = window.B8, API = null, CUR = null;
  function nowSec() { return Math.floor(Date.now() / 1000); }
  function note(k, v) { var a = API || window.LAB_API; return a ? a.note(k, v) : undefined; }
  function decs() { var d = note('dec') || {}; return B.INJECTS.map(function (x) { return d[x.id] == null ? null : +d[x.id]; }); }
  function allDecided() { return decs().every(function (v) { return v != null; }); }
  function lockDecision(k) { return function () { return decs()[k - 1] != null ? false : 'Unlocks after you commit your decision at Inject ' + k + ' on the Exercise tab.'; }; }
  function lockAll() { return allDecided() ? false : 'Unlocks when all eight decisions are committed and the what-if replay opens on the Exercise tab.'; }

  function live() {
    var mode = note('mode') || 'solo', n = nowSec();
    if (mode === 'solo') { var c = +(note('solo') || 0); return { mode: mode, count: c, idx: c - 1, sim: c ? B.INJECTS[c - 1].t : 0 }; }
    if (mode === 'fac') {
      var f = note('fac');
      if (!f || !f.started) return { mode: mode, count: 0, idx: -1, sim: 0 };
      var d = B.derive(f, n); d.mode = mode; d.fac = f; return d;
    }
    var code = note('code'), dec = code ? B.decode(code, n) : null;
    if (!dec || !dec.state) return { mode: mode, count: 0, idx: -1, sim: 0, noCode: true };
    var dt = B.derive(dec.state, n); dt.mode = mode; dt.state = dec.state; return dt;
  }
  function mmss(s) { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + (s % 60 < 10 ? '0' : '') + (s % 60); }

  function keepFocus(fn) {
    var a = document.activeElement, id = a && a.id, s1, s2;
    try { s1 = a.selectionStart; s2 = a.selectionEnd; } catch (e) { }
    fn();
    if (id) { var el = document.getElementById(id); if (el && el !== document.activeElement) { el.focus({ preventScroll: true }); try { if (s1 != null) el.setSelectionRange(s1, s2); } catch (e) { } } }
  }

  /* ---------- Facilitator actions: every schedule change issues a new code ---------- */
  function facCode(f, reason) {
    var st = { iv: f.iv, b: f.b, paused: f.paused, anchor: f.paused ? f.within : f.t0 };
    f.code = B.encode(st);
    f.history = (f.history || []).concat([{ code: f.code, at: Date.now(), reason: reason }]).slice(-6);
  }
  function facAction(kind) {
    var f = note('fac') || { iv: 1 }, n = nowSec();
    if (kind === 'start') { f = { iv: f.iv == null ? 1 : f.iv, b: 0, t0: n, paused: false, within: 0, started: true, history: [] }; facCode(f, 'start'); }
    else if (f.started) {
      var d = B.derive(f, n);
      if (kind === 'pause' && !f.paused) { f.b = d.idx; f.within = Math.min(Math.floor(d.within), B.IVS[f.iv]); f.paused = true; facCode(f, 'pause'); }
      else if (kind === 'resume' && f.paused) { f.t0 = n - (f.within || 0); f.paused = false; facCode(f, 'resume'); }
      else if (kind === 'next' && d.idx < 7) { f.b = d.idx + 1; f.within = 0; f.t0 = n; facCode(f, 'next'); }
      else if (kind === 'end') { if (!confirm('End this exercise? Teams keep their decisions. You can start a new session afterward.')) return; f = { iv: f.iv }; }
    }
    note('fac', f); renderLive(true);
  }

  /* ---------- Rendering ---------- */
  function esc(s) { return API.esc(s); }
  function sgn(v, unit, dec) { var s = (v > 0 ? '+' : v < 0 ? '−' : '±') + Math.abs(v).toFixed(dec || 0); return s + (unit || ''); }
  function fxLine(e) {
    return 'Projected impact of this move: downtime ' + sgn(e.dt, ' h') + ', patient records ' + sgn(e.ex, 'K') + ', direct cost ' + sgn(e.cost / 1000, 'M', 2).replace(/^([+−±])/, '$1$') + ', exercise value ' + sgn(e.rep, ' pts') + '.';
  }
  function injCard(x, k, newest, D) {
    var mine = D[k], draft = CUR.draft6 && CUR.draft6[x.id];
    var opts = x.opts.map(function (op, c) {
      var cls = mine != null ? (mine === c ? ' mine' : ' dim') : '';
      return '<label class="b8-opt' + cls + '"><input type="radio" name="b8d-' + x.id + '" id="b8d-' + x.id + '-' + c + '" value="' + c + '" data-dec="' + x.id + '"' + ((mine != null ? mine === c : draft === c) ? ' checked' : '') + (mine != null ? ' disabled' : '') + '><span><b>' + B.LETTERS[c] + '.</b> ' + esc(op.t) + (mine === c ? ' <span class="b8-tag">your decision</span>' : '') + '</span></label>';
    }).join('');
    var res = '';
    if (mine != null) {
      var e = B.effect(k, mine, D);
      res = '<div class="b8-res" role="status"><b>What happens.</b> ' + esc(x.opts[mine].res) + (e.notes.length ? ' ' + esc(e.notes.join(' ')) : '') + '<span class="fx">' + esc(fxLine(e.d)) + '</span></div>';
    }
    return '<article class="b8-inj' + (newest ? ' newest' : '') + '" aria-labelledby="b8h-' + x.id + '">' +
      '<div class="b8-inj-h">Inject ' + (k + 1) + ' of 8 &middot; ' + B.tplus(x.t) + ' &middot; ' + B.wall(x.t) + (newest ? ' &middot; newest' : '') + (mine != null ? ' &middot; decision committed' : ' &middot; decision needed') + '</div>' +
      '<h5 id="b8h-' + x.id + '">' + x.id + '. ' + esc(x.title) + '</h5>' +
      '<p><b>Situation.</b> ' + esc(x.sit) + '</p>' +
      '<p class="b8-pending">Plan sections in play: ' + esc(x.refs) + '</p>' +
      '<div class="b8-dec"><fieldset><legend>' + esc(x.ask) + '</legend>' + opts + '</fieldset>' +
      (mine == null ? '<div class="b8-btnrow"><button type="button" class="btn" id="b8-commit-' + x.id + '" data-commit="' + x.id + '">Commit decision</button><span class="b8-pending">Decisions are final once committed, as in a real incident.</span></div>' : '') + res + '</div></article>';
  }
  function feedHTML(L) {
    if (!L.count) return '<p class="b8-empty">No injects released yet. ' + (L.mode === 'solo' ? 'Select <b>Start exercise</b> to release Inject 1.' : L.mode === 'fac' ? 'Select <b>Start exercise</b> to begin the clock.' : 'Enter the session code to join.') + '</p>';
    var D = decs(), out = [];
    for (var i = L.count - 1; i >= 0; i--) out.push(injCard(B.INJECTS[i], i, i === L.count - 1, D));
    var open = D.slice(0, L.count).filter(function (v) { return v == null; }).length;
    return '<p class="b8-pending" style="margin-bottom:.6rem">' + L.count + ' of 8 injects released. Newest first. ' + (open ? '<b>' + open + ' decision' + (open > 1 ? 's' : '') + ' waiting.</b> ' : '') + 'Your decisions are saved on this device only.</p><div class="b8-feed">' + out.join('') + '</div>';
  }

  function chartSVG(lines, n) {
    // lines: [{steps, cls, pt, lbl}] cumulative total cost ($K) after each inject
    var W = 640, H = 190, l = 52, r = 16, t = 14, b = 30, max = 1000;
    lines.forEach(function (ln) { ln.steps.forEach(function (s) { max = Math.max(max, s.total); }); });
    max = Math.ceil(max / 1000) * 1000;
    function X(i) { return l + (W - l - r) * i / 7; }
    function Y(v) { return t + (H - t - b) * (1 - v / max); }
    var g = '', stepK = max <= 6000 ? 1000 : max <= 12000 ? 2000 : 5000;
    for (var v = 0; v <= max; v += stepK) g += '<line class="grid" x1="' + l + '" x2="' + (W - r) + '" y1="' + Y(v) + '" y2="' + Y(v) + '"/><text x="' + (l - 6) + '" y="' + (Y(v) + 4) + '" text-anchor="end">$' + (v / 1000) + 'M</text>';
    for (var i = 0; i < 8; i++) g += '<text x="' + X(i) + '" y="' + (H - 10) + '" text-anchor="middle">I' + (i + 1) + '</text>';
    lines.forEach(function (ln) {
      var s = ln.steps.slice(0, n); if (!s.length) return;
      g += '<polyline class="' + ln.cls + '" points="' + s.map(function (p, i) { return X(i) + ',' + Y(p.total); }).join(' ') + '"/>';
      s.forEach(function (p, i) { g += '<circle class="' + ln.pt + '" cx="' + X(i) + '" cy="' + Y(p.total) + '" r="4"/>'; });
      var lp = s[s.length - 1], lx = X(s.length - 1);
      g += '<text class="' + ln.lbl + '" x="' + (lx > W - 90 ? lx - 8 : lx + 8) + '" y="' + (Y(lp.total) + (ln.dy || -8)) + '" text-anchor="' + (lx > W - 90 ? 'end' : 'start') + '">' + B.money(lp.total) + '</text>';
    });
    return '<svg class="b8-chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(lines.map(function (ln) { var s = ln.steps.slice(0, n); return ln.name + ': total cost ' + (s.length ? B.money(s[s.length - 1].total) : 'none') + ' after ' + s.length + ' injects'; }).join('; ')) + '"><line class="ax" x1="' + l + '" x2="' + (W - r) + '" y1="' + Y(0) + '" y2="' + Y(0) + '"/>' + g + '</svg>';
  }
  function tile(label, val, unit, delta, goodDown, meter) {
    var cls = delta == null || delta === 0 ? '' : ((delta > 0) === goodDown ? ' up' : ' good');
    return '<div class="b8-tile"><span class="b8-lbl">' + label + '</span><span class="v">' + val + '<span class="u">' + unit + '</span></span>' + (meter != null ? '<div class="b8-meter" aria-hidden="true"><i style="width:' + meter + '%"></i></div>' : '') + '<span class="dl' + cls + '">' + (delta == null ? '&nbsp;' : 'Last decision ' + delta) + '</span></div>';
  }
  function icHTML(L) {
    var D = decs(), m = B.model(D, L.count), last = CUR.lastDec, ld = null;
    if (last != null && D[last] != null && last < L.count) ld = B.effect(last, D[last], D).d;
    var waiting = D.slice(0, L.count).filter(function (v) { return v == null; }).length;
    var sum = L.count ? 'Scenario time ' + B.tplus(L.sim || 0) + ' (' + B.wall(L.sim || 0) + '). ' + m.decided + ' of ' + L.count + ' released decisions committed' + (waiting ? '; waiting decisions are not yet counted.' : '.') + ' Projected cost includes disruption at $' + B.BI_RATE + 'K per downtime hour.' : 'The impact clock starts when Inject 1 is released. Every facilitation move you commit changes how the room plays the scenario.';
    return '<section class="b8-ic" aria-labelledby="b8-ic-h"><h4 id="b8-ic-h">Impact clock: the scenario as your room plays it</h4><p class="b8-ic-sum">' + sum + '</p>' +
      '<div class="b8-tiles">' +
        tile('Downtime', m.dt, ' h', ld ? sgn(ld.dt, ' h') : null, true) +
        tile('Patient records exposed', m.ex, 'K', ld ? sgn(ld.ex, 'K') : null, true) +
        tile('Projected cost', B.money(m.total), '', ld ? sgn((ld.cost + B.BI_RATE * ld.dt) / 1000, 'M', 2).replace(/^([+\u2212\u00b1])/, '$1$') : null, true) +
        tile('Exercise value', m.rep, ' / 100', ld ? sgn(ld.rep, ' pts') : null, false, m.rep) + '</div>' +
      '<span class="b8-lbl">Total cost after each inject (direct cost plus service disruption)</span>' + chartSVG([{ name: 'Your path', steps: m.steps, cls: 'ln', pt: 'pt', lbl: 'lbl' }], L.count) + '</section>';
  }

  function wiHTML() {
    var D = decs(); if (!D.every(function (v) { return v != null; })) return '';
    var W = note('wi'); if (!W || W.length !== 8) W = D.slice();
    var mine = B.model(D, 8), alt = B.model(W, 8);
    var rows = B.INJECTS.map(function (x, k) {
      return '<div class="b8-wi-row"><span><b>' + x.id + '.</b> ' + esc(x.title) + '</span><span class="b8-seg" role="group" aria-label="What-if decision for ' + x.id + '">' + B.LETTERS.split('').map(function (L, c) {
        return '<button type="button" id="b8w-' + x.id + '-' + c + '" data-wi="' + k + '" data-c="' + c + '" aria-pressed="' + (W[k] === c) + '"' + (D[k] === c ? ' class="yours" title="Your committed decision"' : '') + '>' + L + (D[k] === c ? '<span class="sr-only"> (your decision)</span>' : '') + '</button>';
      }).join('') + '</span></div>';
    }).join('');

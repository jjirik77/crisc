        '<div class="lb-panel" role="tabpanel" id="pn-plan" aria-labelledby="tb-plan" hidden>' + plansHTML() + '</div>' +
        '<div class="lb-panel" role="tabpanel" id="pn-ctx" aria-labelledby="tb-ctx" hidden>' + ctxHTML() + '</div></div>';
      var tabs = [].slice.call(root.querySelectorAll('[role=tab]'));
      function sel(t) { tabs.forEach(function (x) { var on = x === t; x.setAttribute('aria-selected', on); x.tabIndex = on ? 0 : -1; document.getElementById(x.getAttribute('aria-controls')).hidden = !on; }); api.note('tab', t.id); }
      tabs.forEach(function (t, i) { t.addEventListener('click', function () { sel(t); }); t.addEventListener('keydown', function (e) { if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { var n = tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length]; sel(n); n.focus(); } }); });
      if (api.note('tab')) { var tt = document.getElementById(api.note('tab')); if (tt) sel(tt); }

      root.addEventListener('click', function (e) {
        var b = e.target.closest('button'); if (!b || !root.contains(b)) return;
        if (b.dataset.mode) { api.note('mode', b.dataset.mode); CUR.err = null; CUR.draft = null; renderLive(true); return; }
        if (b.id === 'b8-rel') { var c = Math.min(8, +(api.note('solo') || 0) + 1); api.note('solo', c); renderLive(); var nb = document.getElementById('b8-rel'); if (nb && !nb.disabled) nb.focus(); else { var h = document.getElementById('b8h-I' + c); if (h) { h.setAttribute('tabindex', '-1'); h.focus(); } } return; }
        if (b.dataset.iv != null) { var f = api.note('fac') || {}; f.iv = +b.dataset.iv; api.note('fac', f); renderLive(); return; }
        if (b.id === 'b8-start') { facAction('start'); var p = document.getElementById('b8-pause'); if (p) p.focus(); return; }
        if (b.id === 'b8-pause') { facAction('pause'); var r = document.getElementById('b8-resume'); if (r) r.focus(); return; }
        if (b.id === 'b8-resume') { facAction('resume'); var q = document.getElementById('b8-pause'); if (q) q.focus(); return; }
        if (b.id === 'b8-next') return facAction('next');
        if (b.id === 'b8-end') return facAction('end');
        if (b.id === 'b8-fs') { var bd = document.getElementById('b8-board'); if (document.fullscreenElement) document.exitFullscreen(); else if (bd && bd.requestFullscreen) bd.requestFullscreen(); return; }
        if (b.id === 'b8-join') return join();
        if (b.dataset.commit) return commit(b.dataset.commit);
        if (b.dataset.wi != null) { var W = api.note('wi'); if (!W || W.length !== 8) W = decs(); W[+b.dataset.wi] = +b.dataset.c; api.note('wi', W); keepFocus(function () { CUR.root.querySelector('#b8-wibox').innerHTML = wiHTML(); }); return; }
        if (b.id === 'b8-wi-mine') { api.note('wi', decs()); keepFocus(function () { CUR.root.querySelector('#b8-wibox').innerHTML = wiHTML(); }); return; }
        if (b.id === 'b8-wi-ver') {
          var W2 = api.note('wi'); if (!W2 || W2.length !== 8) W2 = decs();
          var S = api.state(), applied = 0;
          LAB.checklist.forEach(function (it) { if (it.inj != null && S.st[it.id] === 'ok') { W2[it.inj] = it.answer; applied++; } });
          api.note('wi', W2); keepFocus(function () { CUR.root.querySelector('#b8-wibox').innerHTML = wiHTML(); });
          var mg = document.getElementById('b8-wi-msg'); if (mg) mg.textContent = applied ? 'Applied ' + applied + ' verified checklist answer' + (applied > 1 ? 's' : '') + '. ' + mg.textContent : 'No decision items are verified yet. Verify checklist items 1 to 8 first.';
          return;
        }
      });
      function join() {
        var inp = document.getElementById('b8-codein'), d = B.decode(inp.value, nowSec());
        if (d.error) { CUR.err = d.error; CUR.draft = inp.value; renderLive(); var i2 = document.getElementById('b8-codein'); if (i2) i2.focus(); return; }
        CUR.err = null; CUR.draft = null; api.note('code', d.state.code); renderLive(true);
        var i3 = document.getElementById('b8-codein'); if (i3) i3.focus();
      }
      root.addEventListener('keydown', function (e) { if (e.target.id === 'b8-codein' && e.key === 'Enter') { e.preventDefault(); join(); } });
      root.addEventListener('input', function (e) { if (e.target.id === 'b8-codein') CUR.draft = e.target.value; });
      root.addEventListener('change', function (e) { var t = e.target; if (t.dataset.dec) { CUR.draft6[t.dataset.dec] = +t.value; } });
      document.addEventListener('fullscreenchange', function () { var fb = document.getElementById('b8-fs'); if (fb) fb.textContent = document.fullscreenElement ? 'Exit full screen' : 'Present full screen'; });
      renderLive(true);
    },
    lockDecision: lockDecision,
    lockAll: lockAll
  };

  /* ---------- Report: add the learner's incident path ---------- */
  function pathHTML() {
    var D = decs(), S = (API || window.LAB_API).state(), m = B.model(D, 8);
    var byInj = {}; LAB.checklist.forEach(function (it) { if (it.inj != null) byInj[it.inj] = it; });
    var rows = B.INJECTS.map(function (x, k) {
      var it = byInj[k], known = it && (S.st[it.id] === 'ok' || S.revealed[it.id]);
      var mine = D[k], e = mine != null ? B.effect(k, mine, D).d : null;
      return '<tr><td>' + x.id + '. ' + esc(x.title) + '</td><td>' + (mine == null ? '<em>Not committed</em>' : B.LETTERS[mine] + '. ' + esc(x.opts[mine].t)) + '</td><td>' + (known ? B.LETTERS[x.best] + (mine === x.best ? ' (matches)' : '') : 'Shown after item ' + (k + 1) + ' is verified') + '</td><td>' + (e ? sgn(e.dt, ' h') + ', ' + sgn(e.rep, ' value') + ', ' + sgn((e.cost + B.BI_RATE * e.dt) / 1000, 'M', 2).replace(/^([+\u2212\u00b1])/, '$1$') : '') + '</td></tr>';
    }).join('');
    return '<div class="b8-path-wrap" id="b8-path"><h3>Your facilitation path</h3><div class="table-wrap"><table class="data"><thead><tr><th>Inject</th><th>Your committed move</th><th>Supported move</th><th>Projected impact (downtime, exercise value, total cost)</th></tr></thead><tbody>' + rows +
      '<tr class="px-total"><td>Outcome of your path</td><td colspan="3">' + (m.decided === 8 ? 'Downtime ' + m.dt + ' h; exposure ' + m.ex + 'K records; total cost ' + B.money(m.total) + '; exercise value ' + m.rep + ' of 100.' : m.decided + ' of 8 decisions committed.') + '</td></tr></tbody></table></div></div>';
  }
  function decorateReport() {
    var rep = document.querySelector('.px-report'); if (!rep || rep.querySelector('#b8-path') || !API) return;
    var hs = rep.querySelectorAll('h3'), anchor = null;
    for (var i = 0; i < hs.length; i++) if (/Answers recorded/.test(hs[i].textContent)) anchor = hs[i];
    if (anchor) anchor.insertAdjacentHTML('beforebegin', pathHTML());
  }
  document.addEventListener('DOMContentLoaded', function () {
    var app = document.getElementById('app');
    if (app) new MutationObserver(decorateReport).observe(app, { childList: true, subtree: true });
  });
  if (!API) { var waitApi = setInterval(function () { if (window.LAB_API) { API = API || window.LAB_API; clearInterval(waitApi); decorateReport(); } }, 200); }

  // Automated test hook: release every inject in Solo mode and commit a path
  window.LAB_TEST_UNLOCK = function () { var a = API || window.LAB_API; if (!a) return; a.note('mode', 'solo'); a.note('solo', 8); a.note('maxSeen', 8); var d = {}; B.INJECTS.forEach(function (x, k) { d[x.id] = (x.best + 1 + (k % 3)) % 4; }); a.note('dec', d); if (CUR) renderLive(true); };

  window.LAB_SELFTEST = function () {
    var log = [], P = [], now = nowSec(), i, j;
    // 1) Round-trip encode/decode
    var states = [
      { iv: 1, b: 0, paused: false, anchor: now - 30 },
      { iv: 0, b: 3, paused: false, anchor: now - 400 },
      { iv: 2, b: 7, paused: false, anchor: now - 3600 },
      { iv: 1, b: 4, paused: true, anchor: 100 },
      { iv: 2, b: 0, paused: true, anchor: 0 },
      { iv: 2, b: 6, paused: true, anchor: 600 }
    ];
    var kb = Math.ceil(now / B.M) * B.M; states.push({ iv: 1, b: 2, paused: false, anchor: kb - 5, _now: kb + 100 });
    states.forEach(function (s, k) {
      var c = B.encode(s), n = s._now || now, d = B.decode(B.fmtCode(c).toLowerCase(), n);
      if (!/^[0-9A-HJKMNP-TV-Z]{7}$/.test(c)) P.push('code ' + c + ' has unexpected characters');
      if (!d.state) { P.push('state ' + k + ' failed to decode: ' + d.error); return; }
      var ok = d.state.iv === s.iv && d.state.b === s.b && d.state.paused === s.paused && (s.paused ? d.state.within === s.anchor : d.state.t0 === s.anchor);
      if (!ok) P.push('state ' + k + ' did not round-trip (' + c + ')');
    });
    log.push('round-trip ' + states.length + ' session states');
    // 2) Checksum rejects every single-character corruption; wrong tags rejected
    var base = B.encode(states[0]), accepted = 0, tried = 0;
    for (i = 0; i < 7; i++) for (j = 0; j < 32; j++) {
      if (B.ALPHA[j] === base[i]) continue;
      var bad = base.slice(0, i) + B.ALPHA[j] + base.slice(i + 1); tried++;
      if (B.decode(bad, now).state) accepted++;
    }
    if (accepted) P.push(accepted + ' corrupted codes were accepted');
    log.push('checksum rejected ' + (tried - accepted) + '/' + tried + ' single-character corruptions');
    if (B.decode('ABC-DEF', now).state || B.decode('ABC-DEFU!', now).state || B.decode('', now).state) P.push('malformed code accepted');
    [0, 2, 3].forEach(function (tag) { var v = (((tag * 4 + 1) * 2) * 8) * B.M + 5, ch = []; for (var q = 5; q >= 0; q--) { ch[q] = v % 32; v = Math.floor(v / 32); } ch.push(B.checksum(ch)); if (B.decode(ch.map(function (x) { return B.ALPHA[x]; }).join(''), now).state) P.push('code with lab tag ' + tag + ' accepted'); });
    // CISSP-format code (tag 3, checksum seed 7) must not be accepted here
    (function () { var v = (((3 * 4 + 1) * 2) * 8) * B.M + 5, ch = [], s = 7; for (var q = 5; q >= 0; q--) { ch[q] = v % 32; v = Math.floor(v / 32); } ch.forEach(function (x, i2) { s += (2 * i2 + 1) * x; }); ch.push(s % 32); if (B.decode(ch.map(function (x) { return B.ALPHA[x]; }).join(''), now).state) P.push('CISSP-format code accepted'); })();
    // 3) Inject derivation at sample times
    var I = B.IVS[1], t0 = 1800000000;
    [[0, 0], [I - 1, 0], [I, 1], [3 * I - 1, 2], [7 * I, 7], [7 * I + 9999, 7], [-50, 0]].forEach(function (c) {
      var d = B.derive({ iv: 1, b: 0, paused: false, t0: t0 }, t0 + c[0]); if (d.idx !== c[1]) P.push('running b=0 at +' + c[0] + 's gave inject ' + (d.idx + 1) + ', expected ' + (c[1] + 1));
    });
    var I0 = B.IVS[0], d3 = B.derive({ iv: 0, b: 3, paused: false, t0: t0 }, t0 + 2 * I0 + 10); if (d3.idx !== 5 || d3.within !== 10) P.push('running b=3, fast pace, two windows plus 10 s should be inject 6 with 10 s elapsed');
    var d4 = B.derive({ iv: 2, b: 7, paused: false, t0: t0 }, t0 + 30); if (d4.nextIn !== null || d4.idx !== 7) P.push('final inject should have no next release');
    [0, 500, 99999].forEach(function (dt) { var x4 = B.INJECTS[4], x5 = B.INJECTS[5], d = B.derive({ iv: 1, b: 4, paused: true, within: B.IVS[1] / 2 }, t0 + dt); if (d.idx !== 4 || d.nextIn !== null || Math.abs(d.sim - (x4.t + (x5.t - x4.t) * 0.5)) > 1e-9) P.push('paused state drifted at +' + dt + 's'); });
    var dr = B.derive({ iv: 1, b: 4, paused: false, t0: t0 - 120 }, t0); if (dr.idx !== 4 || dr.within !== 120) P.push('resume anchor should keep the elapsed time in the inject');
    var pc = B.decode(B.encode({ iv: 1, b: 2, paused: true, anchor: 90 }), now).state, rc = B.decode(B.encode({ iv: 1, b: 2, paused: false, anchor: now - 90 }), now).state;
    if (B.derive(pc, now + 5000).idx !== 2 || B.derive(rc, now + I - 90).idx !== 3 || B.derive(rc, now + I - 91).idx !== 2) P.push('decoded pause/resume derivation wrong');
    log.push('inject derivation checked at sample times, including paused states');
    // 4) Consequence model: the plan-supported path, re-derived independently
    var X = B.INJECTS, best = X.map(function (x) { return x.best; });
    var dt = 0, cost = 0, ex = 0, rep = 100;
    X.forEach(function (x) { var o = x.opts[x.best].d; dt += x.base.dt + o.dt; cost += x.base.cost + o.cost; ex += x.base.ex + o.ex; rep += x.base.rep + o.rep; if (x.opts[x.best].flag) P.push(x.id + ' best option should not set a penalty flag'); });
    var tot = cost + B.BI_RATE * dt;
    if (dt !== B.answers.bestDowntime()) P.push('best-path downtime mismatch: ' + dt + ' vs ' + B.answers.bestDowntime());
    if (Math.abs(tot / 1000 - B.answers.bestCostM()) > 1e-9) P.push('best-path cost mismatch');
    // The checklist keys must match the inject keys and options
    LAB.checklist.forEach(function (it) { if (it.inj == null) return; var x = X[it.inj]; if (it.answer !== x.best) P.push(it.id + ' key differs from ' + x.id + ' best'); if (it.options.join('|') !== x.opts.map(function (o) { return o.t; }).join('|')) P.push(it.id + ' options differ from the workbench'); });
    // Exhaustive: the plan path is lowest total cost, lowest exposure, and highest exercise value of all 65,536 paths
    var path = [0, 0, 0, 0, 0, 0, 0, 0], beat = 0, ties = 0, minDt = 1e9, n = 0;
    for (var code = 0; code < 65536; code++) {
      for (i = 0; i < 8; i++) path[i] = (code >> (2 * i)) & 3;
      var m = B.model(path, 8); n++;
      if (m.dt < minDt) minDt = m.dt;
      if (path.join() === best.join()) continue;
      if (m.total < tot || m.rep > rep || m.ex < ex) beat++;
      if (m.total === tot) ties++;
    }
    if (beat) P.push(beat + ' paths beat the plan path on cost, exposure, or exercise value');
    if (ties) P.push(ties + ' paths tie the plan path on total cost');
    // Every option produces a visibly different consequence within its inject
    X.forEach(function (x) { var sig = x.opts.map(function (o) { return [o.d.dt, o.d.ex, o.d.cost, o.d.rep].join(); }); if (sig.filter(function (s, k) { return sig.indexOf(s) === k; }).length !== 4) P.push(x.id + ' has options with identical consequences'); });
    // Option-length balance: the keyed option is never the strictly longest
    X.forEach(function (x) { var L = x.opts.map(function (o) { return o.t.length; }), bl = L[x.best]; if (L.every(function (v, k) { return k === x.best || v < bl; })) P.push(x.id + ' keyed option is the longest'); });
    var letters = best.map(function (b) { return 'ABCD'[b]; }).join('');
    for (i = 1; i < 8; i++) if (X[i].t <= X[i - 1].t) P.push('inject times not increasing');
    log.push('plan path ' + letters + ': downtime ' + dt + ' h (fastest possible ' + minDt + ' h), exposure ' + ex + 'K, total ' + B.money(tot) + ', exercise value ' + rep + '; checked ' + n + ' paths');
    return { log: log, problems: P };
  };
})();
</script>

<script>
window.LAB = {
  id: 'B8',
  title: 'Ransomware Tabletop Facilitation',
  accent: 'Tabletop Facilitation',
  domain: 'Domains 3 and 4 (Task 24)',
  time: '75 min',
  level: 'Advanced',
  lessonHref: 'lesson09.html#s5',
  lessonLabel: 'Lesson 9, Capstone Case and Tabletop Facilitation',
  kus: ['Business Continuity and Disaster Recovery (BCD)', 'Cybersecurity Planning and Management (CPM)', 'Policy, Legal, Ethics, and Compliance (PLE)', 'Supply Chain Security (SCS)'],
  lede: 'Facilitate a ransomware tabletop for a regional health system. At each of eight injects, choose the facilitation move a risk practitioner should make, watch the impact clock show how the room plays the scenario, and then write the after-action report that turns findings into risk register updates and KRIs. Run it solo, or as a facilitated class with team codes.',
  workbenchTitle: 'Tabletop workbench',
  ticket: {
    number: 'ERM-2027-0214',
    priority: 'Risk committee request',
    from: 'Dr. Helen Marsh, CEO, Ironvale Health Partners',
    to: 'ERM risk practitioner and exercise facilitator (you)',
    subject: 'Facilitate the ransomware tabletop and report back to the risk committee',
    due: 'After-action report to the risk committee within 10 business days (Exercise plan 6)',
    body: '<p>Ironvale Health Partners runs three hospitals and 22 clinics. Ransomware against clinical systems is the top scenario in this year’s risk assessment, and the risk committee wants to know whether our plans hold up before a real attack tests them. You wrote the exercise plan; now <b>you facilitate the tabletop</b>.</p>' +
      '<p>Remember your role. You deliver the injects, keep time, ask probing questions, and make sure the right people make the decisions. <b>You do not make the decisions.</b> The COO, the CFO, the CIO, and I own them, with the board where the plan says so. Your job is to make the exercise reveal what works and what does not.</p>' +
      '<p>Eight injects arrive over three days of scenario time. At each one, commit the move you would make in the room. The impact clock projects what the room’s decisions would cost Ironvale if they were real: <b>downtime, patient records exposed, cost, and exercise value</b>. Use the exercise plan, the IRP excerpt, the appetite statement, the notification matrix, and the risk register extract on the workbench.</p>' +
      '<p>When it is over, write the after-action report: which objectives were met, the findings, corrective actions with owners and due dates, and the specific updates to the risk register and its KRIs.</p>'
  },
  howTo: 'Choose a mode on the <b>Exercise</b> tab. <b>Solo</b>: release each inject yourself after you commit a move. <b>Facilitator</b>: for the projector; start the clock, show the session code, and display each inject with its options for discussion. <b>Team</b>: type the projector’s session code on your device; timing follows the facilitator, and your team’s moves stay on your device. If the facilitator pauses or skips ahead, a new code appears; enter it to re-sync. Decision items unlock as you commit each move. When all eight are committed, the <b>what-if replay</b> opens for the number items. The report shows your path. In team mode, enter the team name and members on the report.',
  workIntro: 'Release or follow the injects on the <b>Exercise</b> tab, check each option against the <b>Exercise packet</b> and the <b>Register and context</b> documents, and commit a move. Watch the impact clock. Checklist items unlock as your moves are committed.',
  checklist: [
    { id: 'd1', inj: 0, type: 'choice', points: 7, short: 'I1: declaration', title: 'Inject 1: nobody declares',
      locked: B8UI.lockDecision(1),
      task: 'The room is lost in technical detail and nobody has declared an incident. Which facilitation move <b>best</b> follows the ground rules in Exercise plan 3?',
      options: B8.INJECTS[0].opts.map(function (o) { return o.t; }), answer: 2,
      hint: 'Who declares under IRP 2.1? What does the exercise plan say the facilitator may and may not do?',
      debrief: '<p>The facilitator guides; the participants who own the decisions make them. Pausing the discussion and asking “who decides?” is the facilitator’s most useful tool, because it tests the decision rights that the plan assumes. Declaring the incident yourself keeps the clock moving but tests nothing, and a long technical walk-through uses up time the objectives need.</p><p>Objective O1 is about the first hour, which is where real incidents most often go wrong. Skipping ahead to the dramatic inject leaves the most important decisions unexercised.</p>',
      reviewNote: 'The facilitator does not decide; ask who owns the decision under the plan and let that person decide.' },
    { id: 'd2', inj: 1, type: 'choice', points: 7, short: 'I2: escalation', title: 'Inject 2: escalation against appetite',
      locked: B8UI.lockDecision(2),
      task: 'The EHR is down at all three hospitals and the COO wants to wait until noon. Which move <b>best</b> tests objective O1?',
      options: B8.INJECTS[1].opts.map(function (o) { return o.t; }), answer: 0,
      hint: 'The appetite statement sets a tolerance and an escalation rule. Who should apply it, and with what in front of them?',
      debrief: '<p>Appetite and tolerance only work if the risk owner uses them when it matters. Asking the COO to compare the outage with the stated tolerance puts the decision where it belongs and shows whether the threshold is known and usable. The finding that nobody knew the threshold is exactly what a tabletop is for.</p><p>Calling the board chair yourself bypasses the owner and invents an escalation path. Simply accepting the wait respects ownership but lets the owner decide without the information the plan provides. Teaching in the middle of the inject replaces practice with a lecture.</p>',
      reviewNote: 'Have the risk owner apply the tolerance in the appetite statement; the practitioner does not escalate on the owner’s behalf.' },
    { id: 'd3', inj: 2, type: 'choice', points: 7, short: 'I3: findings', title: 'Inject 3: capturing a finding without blame',
      locked: B8UI.lockDecision(3),
      task: 'The downtime forms are out of date, the room starts redesigning them, and someone asks who is to blame. Which move is <b>best</b>?',
      options: B8.INJECTS[2].opts.map(function (o) { return o.t; }), answer: 3,
      hint: 'Exercise plan 3 has a rule for fixes, a rule for the scribe, and a rule about fault.',
      debrief: '<p>A tabletop finds gaps; it does not fix them in the room. Logging the gap against the 8-hour MTD, naming a likely owner, and parking the fix keeps time for every objective and gets the gap into the after-action report, where it can be assigned and tracked.</p><p>Asking why the forms were not updated turns a no-fault exercise into a search for blame, and people stop admitting gaps. Waving the gap off as operational detail loses the finding, and the model carries that loss to the final inject.</p>',
      reviewNote: 'Log the finding against the BIA target, park the fix, keep time, and keep the discussion no-fault.' },
    { id: 'd4', inj: 3, type: 'choice', points: 7, short: 'I4: third party', title: 'Inject 4: the vendor’s obligations',
      locked: B8UI.lockDecision(4),
      task: 'A business associate reports a compromise, and nobody knows what the BAA requires. Which move <b>best</b> tests objective O3?',
      options: B8.INJECTS[3].opts.map(function (o) { return o.t; }), answer: 1,
      hint: 'Prepared injects can include documents. Who in the room should read the contract, and what should happen to R-11?',
      debrief: '<p>Outsourcing a service does not outsource the risk. Handing out the contract extract and asking the vendor manager and the privacy officer to interpret it tests whether the owners know the terms. Here they learn the BAA sets a 10-day notice duty but says nothing about the vendor’s own subcontractors, a fourth-party gap.</p><p>The inject also exposes a register problem: R-11’s low rating rests on a questionnaire, not on evidence, and its KRI has no data source. Giving your own guess about the contract or declaring the vendor out of scope leaves both findings undiscovered.</p>',
      reviewNote: 'Have the owners read the actual contract terms; record fourth-party gaps and ratings that rest on weak evidence.' },
    { id: 'd5', inj: 4, type: 'choice', points: 7, short: 'I5: decision rights', title: 'Inject 5: “Should we pay?”',
      locked: B8UI.lockDecision(5),
      task: 'The CFO asks you, the risk practitioner, whether Ironvale should pay the ransom. Which response is <b>best</b>?',
      options: B8.INJECTS[4].opts.map(function (o) { return o.t; }), answer: 3,
      hint: 'IRP 5.2 names the decision maker and the inputs. What is the practitioner’s role in any risk decision?',
      debrief: '<p>The risk practitioner advises and facilitates; the risk owner decides. Here the plan names the CEO with the board, on counsel’s advice, after sanctions screening and an insurer consent check. Redirecting the question and drawing out those inputs tests the real decision path and surfaces a new finding: the backups that make “do not pay” possible have not been restore-tested this year.</p><p>A recommendation to pay, or a firm “we never pay,” is the facilitator making the decision. Handing it to the CFO rehearses the wrong path, and the scribe would record it as if it were correct.</p>',
      reviewNote: 'Point to the decision owner in the plan and bring out the inputs they need; never make the call yourself.' },
    { id: 'd6', inj: 5, type: 'choice', points: 7, short: 'I6: notification', title: 'Inject 6: the notification clock',
      locked: B8UI.lockDecision(6),
      task: 'Counsel says notice can wait until forensics proves data was taken. Which move <b>best</b> tests objective O4?',
      options: B8.INJECTS[5].opts.map(function (o) { return o.t; }), answer: 0,
      hint: 'Read the first row of the notification matrix. Who owns the clock under IRP 5.3?',
      debrief: '<p>The facilitator should not hand down legal conclusions, but should not let an obvious gap pass either. Asking the clock owner to walk the matrix puts the facts in front of the room: under HHS guidance, ransomware affecting PHI is presumed a breach unless a documented risk assessment shows a low probability of compromise, and a leak-site post with names and diagnoses rules that out. Notices go to individuals without unreasonable delay and within 60 days of discovery, to HHS at the same time for 500 or more people, and to the media when more than 500 residents of a state are affected.</p><p>The disagreement between counsel and privacy is itself a finding for training. Telling the room encrypted data is not a breach is wrong, and a premature notice to every patient has to be corrected later.</p>',
      reviewNote: 'Have the clock owner apply the notification matrix; ransomware affecting PHI is a presumed breach.' },
    { id: 'd7', inj: 6, type: 'choice', points: 7, short: 'I7: register reality', title: 'Inject 7: an untested control in the register',
      locked: B8UI.lockDecision(7),
      task: 'Restoring the EHR will miss both the RTO and the RPO, and R-07 rates the risk as low. Which move is <b>best</b>?',
      options: B8.INJECTS[6].opts.map(function (o) { return o.t; }), answer: 2,
      hint: 'Compare the CIO’s figures with the BIA. What does that mean for the rating in R-07, and who confirms the facts?',
      debrief: '<p>This is the most valuable finding of the day: a control the register relies on has never been tested, and the scenario shows it would miss the 24-hour RTO by about 6 hours and the 4-hour RPO by 22. Logging it against R-07, with the CIO as control owner confirming the facts, sets up a register update: the residual rating rises, and the KRI “days since last successful restore test” gets a data source and thresholds.</p><p>Ruling that the restore succeeds hides the result. Redesigning the architecture in the room is a project without an owner. Asking the COO to accept the gap on the spot produces a risk acceptance nobody analyzed.</p>',
      reviewNote: 'Tie exercise results back to the register; a residual rating that rests on an untested control must be revisited.' },
    { id: 'd8', inj: 7, type: 'choice', points: 7, short: 'I8: after-action', title: 'Inject 8: hot wash and follow-through',
      locked: B8UI.lockDecision(8),
      task: 'Time is nearly up and the CEO wants to skip the hot wash. What do you <b>recommend</b>?',
      options: B8.INJECTS[7].opts.map(function (o) { return o.t; }), answer: 1,
      hint: 'Exercise plan 6 lists what comes after the last inject. What turns a finding into a response?',
      debrief: '<p>The most important output of a tabletop is the after-action report with corrective actions and owners. A short hot wash while memories are fresh catches findings the scribe missed, and the report then goes to the risk committee with owners, due dates, and the register and KRI updates, which enter the risk action plan and are monitored like any other action.</p><p>An after-action report with no owners is a record, not a response. Internal audit evaluates but should not own the fixes, and naming people who answered wrongly destroys the no-fault culture the next exercise depends on.</p>',
      reviewNote: 'Always hold the hot wash and issue an after-action report whose actions have owners and due dates.' },
    { id: 'dt', type: 'number', points: 12, short: 'Supported path downtime', title: 'Projected downtime on the supported path',
      locked: B8UI.lockAll, unit: 'hours', tol: 0.5,
      task: 'In the <b>what-if replay</b>, set all eight moves to the supported answers from items 1 to 8 (the <b>Apply my verified checklist answers</b> button helps). What is the projected <b>downtime</b>?',
      answer: function () { return B8.answers.bestDowntime(); },
      hint: 'Verify items 1 to 8 first, then apply them in the replay and read the downtime row in the What-if column. One other path is slightly faster; that is the point of this item.',
      debrief: '<p>The supported path projects 72 hours of disruption, all of it the unavoidable impact of the attack, including the slow EHR restore: none of the supported moves adds downtime of its own. The only faster path pays the ransom, which saves 2 hours, costs $4.6 million, and still exposes the records.</p><p>Downtime is one measure, not the goal. The 72 hours also hide a finding: a restore that takes about 30 hours against a 24-hour RTO. That gap belongs in the after-action report and in R-07.</p>',
      reviewNote: 'Read the What-if column after applying the supported moves; the best path is not the fastest.' },
    { id: 'cost', type: 'number', points: 12, short: 'Supported path cost', title: 'Projected cost on the supported path',
      locked: B8UI.lockAll, unit: '$ millions', tol: 0.01,
      task: 'With the same what-if path, what is the <b>total projected cost</b>, including disruption, in millions of dollars (for example, 2.75)?',
      answer: function () { return B8.answers.bestCostM(); },
      hint: 'Use the Total projected cost row, What-if column. Total cost is direct cost plus $25K per downtime hour.',
      debrief: '<p>The supported path projects $2.64 million: $0.84 million in direct cost and $1.80 million in disruption for 72 hours. No other combination of moves costs less, and none ends with fewer records exposed or a higher exercise value.</p><p>Putting a number on each path helps the risk committee see that facilitation quality has value: a tabletop that loses findings or rehearses the wrong decision path leaves real losses waiting in the next incident.</p>',
      reviewNote: 'Total cost = direct cost + downtime hours x $25K; compare paths on the whole picture.' },
    { id: 'aar', type: 'text', points: 20, short: 'After-action report', title: 'After-action report with register and KRI updates', reportTitle: 'After-action report',
      locked: B8UI.lockAll,
      task: 'Write the after-action report (Exercise plan 6). For each objective, state what was expected, what happened, and whether it was met. List the findings, give each corrective action an owner and a due date, and state the specific updates to the risk register and its KRIs.',
      fields: [
        { key: 'obj', label: 'Objectives O1 to O5: expected, observed, met or not met', min: 80, placeholder: 'One line per objective, with numbers from the impact clock where they help.' },
        { key: 'find', label: 'Findings (no-fault)', min: 60, placeholder: 'Gaps in plans, decision rights, controls, and evidence.' },
        { key: 'act', label: 'Corrective actions, each with an owner and a due date', min: 60, placeholder: 'These enter the risk action plan.' },
        { key: 'reg', label: 'Risk register updates (entries, ratings, owners)', min: 40, placeholder: 'For example, R-07 and R-11.' },
        { key: 'kri', label: 'KRIs to add or fix, with data sources and thresholds', min: 40, placeholder: 'Name each KRI, its data source, and its amber and red thresholds.' }
      ],
      hint: 'Use the scribe’s findings in each inject’s result. Look at the register extract: which ratings rested on untested controls, and which KRIs have no data source?',
      debrief: '<p><b>Model report.</b> <b>Objectives.</b> O1 met after facilitation: the CIO declared at 06:25 and the COO escalated at 07:50, but nobody knew the tolerance before reading it. O2 not met: manual medication ordering ran at 40 percent against an 8-hour MTD. O3 partly met: extortion followed IRP 5.2, but the BAA is silent on subcontractors. O4 met with a gap: counsel and privacy disagreed on the breach trigger. O5 not met: the restore would take about 30 hours against a 24-hour RTO, with data 26 hours old against a 4-hour RPO. The supported path projects 72 hours of downtime and $2.64 million. <b>Findings.</b> Out-of-date downtime forms; tolerance not known to the risk owner; fourth-party gap in the BAA; untested restore; disagreement on the breach presumption.</p>' +
        '<p><b>Corrective actions.</b> Restore test of the EHR from immutable copies, owner CIO, due in 60 days. Update the downtime forms and run a pharmacy drill, owner CNO, due in 45 days. Amend the Corvane BAA to cover subcontractors and request current assurance evidence, owner vendor manager with the lab director, due next renewal or 90 days. Breach-presumption briefing for counsel and privacy, owner privacy officer, due in 30 days. Tolerance card for every risk owner, owner ERM, due in 30 days. <b>Register.</b> Raise R-07 residual from 4 to about 12 (likelihood 3 x impact 4) until a restore test passes; raise R-11 from 4 to about 9 until evidence replaces the questionnaire; record the downtime-form gap under R-14. Owners unchanged; the risk owners review the new ratings. <b>KRIs.</b> Days since last successful EHR restore test, from the backup console (amber over 90, red over 180); restore time in the last test as a percent of RTO (amber over 80, red over 100); age of Corvane assurance evidence, from the vendor file (amber over 12 months, red over 18); manual medication ordering capacity in the last drill (amber under 80 percent, red under 60). Your wording will differ; check that each action has an owner and date, and each KRI has a source and thresholds.</p>',
      reviewNote: 'An after-action report states results by objective and turns findings into owned actions, register updates, and working KRIs.' }
  ],
  workbench: function (root, api) { B8UI.workbench(root, api); }
};

<script>
/* ===================== B3 model: FAIR-style Monte Carlo =====================
   Brightwater Credit Union, outbound wire fraud. Math reused from lesson04.html (Loss Exceedance Simulator):
   mulberry32 seeded RNG; PERT(a,m,b) sampled as a scaled Beta(alpha, beta) with alpha = 1 + 4(m-a)/(b-a),
   beta = 1 + 4(b-m)/(b-a), and Beta = X/(X+Y) where X, Y are Gamma draws (Marsaglia-Tsang, valid for shape >= 1).
   Each simulated year: draw threat event frequency (TEF) and vulnerability (V) from PERT, draw the number of
   loss events from Poisson(TEF x V), draw a PERT net loss for each event, and sum. 10,000 years, fixed seed. */
(function () {
  var N = 10000, SEED = 20261112;
  function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function normal(r) { var u = 0; while (u === 0) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); }
  function gamma(r, k) { var d = k - 1 / 3, c = 1 / Math.sqrt(9 * d); for (;;) { var x, v; do { x = normal(r); v = 1 + c * x; } while (v <= 0); v = v * v * v; var u = r(); if (u < 1 - 0.0331 * x * x * x * x) return d * v; if (Math.log(u) < 0.5 * x * x + d * (1 - v + Math.log(v))) return d * v; } }
  function pert(r, a, m, b) { if (b <= a) return a; var al = 1 + 4 * (m - a) / (b - a), be = 1 + 4 * (b - m) / (b - a); var x = gamma(r, al), y = gamma(r, be); return a + (b - a) * x / (x + y); }
  function poisson(r, l) { if (l <= 0) return 0; if (l > 30) { var n = Math.round(l + Math.sqrt(l) * normal(r)); return n < 0 ? 0 : n; } var L = Math.exp(-l), k = 0, p = 1; do { k++; p *= r(); } while (p > L); return k - 1; }
  function simulate(T, V, M, seed) {
    var r = rng(seed), a = new Float64Array(N);
    for (var i = 0; i < N; i++) {
      var tef = pert(r, T[0], T[1], T[2]), v = pert(r, V[0], V[1], V[2]), n = poisson(r, tef * v), s = 0;
      for (var j = 0; j < n; j++) s += pert(r, M[0], M[1], M[2]);
      a[i] = s;
    }
    a.sort();
    return a;
  }
  function mean(a) { var s = 0; for (var i = 0; i < a.length; i++) s += a[i]; return s / a.length; }
  function pct(a, p) { return a[Math.min(a.length - 1, Math.floor(p * a.length))]; }
  function exceed(a, x) { var lo = 0, hi = a.length; while (lo < hi) { var mid = (lo + hi) >> 1; if (a[mid] <= x) lo = mid + 1; else hi = mid; } return (a.length - lo) / a.length; }
  function summarize(a) { return { a: a, ale: mean(a), p50: pct(a, 0.5), p90: pct(a, 0.9), p99: pct(a, 0.99), over: exceed(a, 1e6) }; }
  function analyze(inp, seed) {
    var cur = summarize(simulate(inp.tef, inp.vc, inp.lm, seed)), pro = summarize(simulate(inp.tef, inp.vp, inp.lm, seed));
    return { inp: inp, seed: seed, cur: cur, pro: pro, reduction: cur.ale - pro.ale, net: cur.ale - pro.ale - inp.cost };
  }
  // Calibrated inputs under Standard RA-04 (the answer key). Vulnerability as a fraction.
  var KEY = { tef: [12, 25, 45], vc: [0.05, 0.12, 0.25], vp: [0.02, 0.04, 0.12], lm: [15000, 110000, 700000], cost: 150000 };
  // Draft values from the prior analyst (four fields break RA-04)
  var DRAFT = { tef: [12, 22.6, 45], vc: [0.05, 0.115, 0.25], vp: [0.02, 0.04, 0.12], lm: [15000, 198000, 700000], cost: 96000 };
  var K = analyze(KEY, SEED);
  window.B3 = { N: N, SEED: SEED, KEY: KEY, DRAFT: DRAFT, analyze: analyze, exceed: exceed, pct: pct,
    answers: { ale: Math.round(K.cur.ale), p90: Math.round(K.cur.p90), over: Math.round(K.cur.over * 1000) / 10, net: Math.round(K.net), proOver: Math.round(K.pro.over * 1000) / 10, proAle: Math.round(K.pro.ale) } };
})();
</script>

<script>
(function () {
  var B = window.B3;
  function A(k) { return function () { return B.answers[k]; }; }
  function money(v) { return (v < 0 ? '-$' : '$') + Math.round(Math.abs(v)).toLocaleString('en-US'); }
  window.LAB = {
    id: 'B3',
    title: 'Quantitative Risk Analysis',
    accent: 'Risk Analysis',
    domain: 'Domain 2',
    time: '70 min',
    level: 'Intermediate to Advanced',
    lessonHref: 'lesson04.html#s4',
    lessonLabel: 'Lesson 4, Risk Analysis Methodologies',
    lede: 'A heat map says wire fraud is “High.” The board wants to know how much it costs in a typical year, how bad a bad year gets, and whether a new control is worth its price. Calibrate a FAIR-style model from the evidence, simulate ten thousand years, and give the risk owner a number she can decide on.',
    workbenchTitle: 'Risk model workbench',
    ticket: {
      number: 'ERM-2026-0418',
      priority: 'High priority',
      from: 'Owen Castellanos, Chief Risk Officer',
      to: 'Risk analyst, ERM (you)',
      subject: 'Wire fraud: quantify current exposure and value the proposed callback control',
      due: 'Before the Risk Committee meets on December 3',
      body: '<p>Brightwater’s outbound wire volume grew again this year, and so did the fraud attempts against it: spoofed vendor invoices, executive impersonation, diverted real-estate closings, and member account takeovers. The register rates the scenario “High,” which does not help the Risk Committee decide anything.</p>' +
        '<p>Priya Raman, VP of Payments and Treasury Operations, owns this risk. Treasury has proposed an <b>independent callback to the number on file, performed by a separate verification team, plus a payee-change analytics service</b>. Priya needs to know whether it is worth the money and whether it brings us inside the board’s tolerance.</p>' +
        '<p>Last year’s analyst left a draft model. Do not trust it until you have checked every input against <b>Risk Analysis Standard RA-04</b>. Use our loss history, the peer consortium ranges, and Treasury’s control data, all in the Data sources tab.</p>' +
        '<p>I need four numbers for the current state (expected annual loss, the 1-in-10-year loss, and the chance of breaching tolerance), the control’s annual value net of its cost, and your recommendation to Priya. Remember whose decision it is.</p>'
    },
    howTo: 'The <b>Data sources</b> tab holds Brightwater’s fraud history, the peer ranges, Treasury’s control data, the calibration standard, and the board’s tolerance. The <b>Model</b> tab is a FAIR-style Monte Carlo simulator: it opens with last year’s draft inputs. Correct them against Standard RA-04 (the <b>Check calibration</b> button tells you which fields break a rule, not the right values), run 10,000 simulated years for the current controls and the proposed control, and read the results and the loss exceedance curve. The simulation is seeded, so the same inputs always give the same results. Enter dollar answers as plain numbers with no commas or dollar sign. After your first check on an item you can reveal the practitioner’s debrief, but a revealed item earns no points.',
    workIntro: 'Brightwater Credit Union data is fictional. All amounts are US dollars of net loss to Brightwater, after recovery. Results are calculated in your browser.',
    checklist: [
      { id: 'tef', type: 'number', points: 8, short: 'TEF most likely', title: 'Calibrate threat event frequency',
        task: 'Under Standard RA-04, what is the <b>most likely</b> threat event frequency: fraudulent wire requests per year?',
        answer: 25, tol: 0.3, unit: 'attempts per year',
        hint: 'RA-04 rule 2 uses Brightwater’s own average over the most recent three full years, not the five-year average. The trend is rising, so older years understate today’s rate.',
        debrief: '<p>Brightwater logged 22, 25, and 28 fraudulent wire requests in 2023, 2024, and 2025, an average of <b>25 a year</b>. The draft used the five-year average of 22.6, which blends in the quieter years before the attack volume grew. The range comes from the peers (12 to 45), so the model still allows for a much busier year than any Brightwater has seen.</p><p>Calibration is where quantitative analysis earns or loses its credibility. A documented rule, applied the same way to every scenario, makes results comparable and lets a reviewer challenge the inputs rather than the arithmetic.</p>',
        reviewNote: 'Most likely frequency = Brightwater’s average over the last three full years (RA-04 rule 2).' },
      { id: 'lm', type: 'number', points: 8, short: 'Loss most likely', title: 'Calibrate loss magnitude',
        task: 'Under Standard RA-04, what is the <b>most likely</b> loss per successful fraud? Enter whole dollars.',
        answer: 110000, tol: 1000, unit: 'US dollars per event',
        hint: 'RA-04 rule 3 asks for the median of Brightwater’s own <b>net</b> losses over five years. Sort the Net loss column of the incident history and take the middle value of the 13 incidents.',
        debrief: '<p>Sorted, the 13 net losses run from $18,000 to $640,000, and the seventh (middle) value is <b>$110,000</b>. The draft used the median <b>gross</b> wire amount, $198,000, which ignores the funds Brightwater recovered through recall requests and the receiving bank. Loss magnitude in FAIR is what the organization actually loses.</p><p>The median, not the mean, is the right “most likely” anchor here. Two large business email compromise losses pull the mean up to about $175,000; the PERT range from $15,000 to $700,000 is what carries that tail into the model.</p>',
        reviewNote: 'Most likely loss = median of Brightwater’s net losses (after recovery), RA-04 rule 3.' },
      { id: 'ale', type: 'number', points: 14, short: 'ALE, current', title: 'Annualized loss expectancy with current controls',
        task: 'With the calibrated inputs, what is the simulated <b>ALE</b> (mean annual loss) under the current controls? Enter whole dollars.',
        answer: A('ale'), tol: Math.round(B.answers.ale * 0.1), unit: 'US dollars per year',
        hint: 'Fix all four draft fields until Check calibration passes, keep seed 20261112, run the simulation, and read the mean annual loss in the Current controls column.',
        debrief: '<p>The simulated ALE is about <b>' + money(B.answers.ale) + '</b> a year. Compare it with the single-point estimate (25 attempts × 12% × $110,000 = $330,000). The simulation is roughly double, because the inputs are skewed to the right: some years bring more attempts, a higher success rate, and a larger loss at the same time, and those years pull the mean up. A single point hides exactly the years a tolerance statement is written about.</p><p>Brightwater actually lost about $456,000 a year on average over the last five years. The model is higher because the attempt rate is rising and because five years is too short to have seen the tail. That gap is worth stating in the memo, not hiding.</p>',
        reviewNote: 'ALE is the mean of the simulated annual losses, not most likely × most likely.' },
      { id: 'p90', type: 'number', points: 12, short: 'P90, current', title: 'The 1-in-10-year loss (P90)',
        task: 'What is the <b>90th percentile</b> of annual loss under the current controls: the amount exceeded in about one year in ten? Enter whole dollars.',
        answer: A('p90'), tol: Math.round(B.answers.p90 * 0.1), unit: 'US dollars per year',
        hint: 'Read P90 in the results table, or find where the current-controls curve crosses 10% on the loss exceedance chart.',
        debrief: '<p>P90 is about <b>' + money(B.answers.p90) + '</b>. In one simulated year in ten, wire fraud costs Brightwater more than that. P90 is a planning number: it sizes reserves, insurance limits, and the conversation about how bad a bad year can be.</p><p>Notice that P90 is already above the board’s $1,000,000 threshold. That alone tells you the tolerance (no more than a 10% chance of exceeding $1,000,000) is breached before you read the exceedance probability.</p>',
        reviewNote: 'P90 is the annual loss exceeded in 10% of simulated years.' },
      { id: 'over', type: 'number', points: 12, short: 'P(loss > $1M)', title: 'Probability of breaching tolerance',
        task: 'Under the current controls, what is the probability that annual net wire-fraud loss <b>exceeds $1,000,000</b>? Enter a percentage.',
        answer: A('over'), tol: 3, unit: '% of simulated years',
        hint: 'The results table shows P(annual loss > $1M). Compare it with the board’s 10% limit.',
        debrief: '<p>About <b>' + B.answers.over + '%</b> of simulated years exceed $1,000,000, roughly double the board’s 10% limit. The current risk is outside tolerance. The practitioner reports that gap to the risk owner and the Risk Committee; the practitioner does not quietly widen the tolerance or round the number down.</p><p>The ALE alone would have hidden this. An ALE of about ' + money(B.answers.ale) + ' sits well under $1,000,000, yet one year in five is worse than the threshold.</p>',
        reviewNote: 'Read the probability of exceeding the tolerance amount, not the ALE, when testing a tolerance statement.' },
      { id: 'net', type: 'number', points: 16, short: 'Net control value', title: 'Annual value of the proposed control, net of cost',
        task: 'What is the proposed control’s annual value <b>net of its annual cost</b>: ALE with current controls, minus ALE with the proposed control, minus the control’s annual cost under RA-04? Enter whole dollars.',
        answer: A('net'), tol: 40000, unit: 'US dollars per year',
        hint: 'RA-04 rule 5: annual cost includes the license, the verification analyst, and the one-time integration spread over the three-year contract. The draft counted only the license.',
        debrief: '<p>The proposed control cuts the ALE from about ' + money(B.answers.ale) + ' to about ' + money(B.answers.proAle) + '. Its annual cost is $150,000: the $96,000 license, $44,000 for half of a verification analyst, and $10,000 a year for the $30,000 integration spread over three years. The net value is about <b>' + money(B.answers.net) + '</b> a year.</p><p>Two cautions belong with that number. The control effect (4% most likely success rate) comes from peer data, not Brightwater’s own experience, so a key control indicator should confirm it in the first year. And cost-benefit is one input to the decision, not the decision: the tolerance result matters as much.</p>',
        reviewNote: 'Net value = ALE before − ALE after − annualized control cost.' },
      { id: 'rec', type: 'choice', points: 16, short: 'Recommendation', title: 'Recommend a response',
        task: 'What should you, as the risk analyst, put in front of the Risk Committee?',
        options: [
          'Approve the control and start procurement now, because its value exceeds its cost, it meets tolerance, and the analysis is complete',
          'Recommend the control to Priya Raman as risk owner: it cuts the chance of a year over $1,000,000 from about ' + Math.round(B.answers.over) + '% to about ' + Math.max(1, Math.round(B.answers.proOver)) + '%, inside the 10% tolerance, at a positive net value',
          'Recommend that Priya Raman accept the current risk, because the ALE is below the $1,000,000 tolerance amount',
          'Recommend crime insurance with a $1,000,000 limit to Priya Raman instead, because transferring the risk is cheaper than mitigating it and she can accept the rest'
        ],
        answer: 1,
        hint: 'Who owns the decision? And which result tests the tolerance statement: the mean, or the probability of exceeding $1,000,000?',
        debrief: '<p>The practitioner analyzes, recommends, and documents; the <b>risk owner</b> decides and formally accepts what remains. With the proposed control, the probability of a year over $1,000,000 falls to about ' + B.answers.proOver + '%, inside tolerance, and the control returns more than it costs. That is a strong recommendation, presented with its assumptions.</p><p>Approving the purchase yourself takes a decision that is not yours. Accepting on the basis of the ALE confuses the average year with the tail the tolerance is written about. Insurance can complement the control for the residual tail, but it does not reduce how often fraud succeeds, and the analysis did not price a policy.</p>',
        reviewNote: 'The practitioner recommends; the risk owner decides. Test tolerance with the exceedance probability.' },
      { id: 'memo', type: 'text', points: 14, short: 'Committee memo', title: 'Write the memo to the Risk Committee', reportTitle: 'Memo to the Risk Committee',
        task: 'Summarize the analysis for the Risk Committee and the risk owner. Use your numbers.',
        fields: [
          { key: 'result', label: 'Current exposure: ALE, P90, and the tolerance result', min: 50, placeholder: 'State the expected annual loss, the 1-in-10-year loss, and the probability of exceeding $1,000,000 against the 10% limit.' },
          { key: 'rec', label: 'Recommendation, decision owner, and the value of the control', min: 50, placeholder: 'Name the response, who decides and accepts the residual risk, and the net annual value.' },
          { key: 'limits', label: 'Key assumptions and how you will validate them', min: 40, placeholder: 'Which inputs are least certain, and what indicator would confirm the control works?' }
        ],
        hint: 'A good memo gives the number, the comparison with tolerance, the decision being asked for, who makes it, and the assumptions that could change it.',
        debrief: '<p><b>Model memo.</b> <b>Current exposure:</b> calibrated under RA-04 and simulated over 10,000 years (seed 20261112), outbound wire fraud has an expected loss of about ' + money(B.answers.ale) + ' a year and a 1-in-10-year loss of about ' + money(B.answers.p90) + '. The chance of a year over $1,000,000 is about ' + B.answers.over + '%, against a board limit of 10%: the risk is outside tolerance. <b>Recommendation:</b> implement the independent callback and payee-change analytics control. It lowers the chance of a year over $1,000,000 to about ' + B.answers.proOver + '% and returns about ' + money(B.answers.net) + ' a year net of its $150,000 annual cost. Priya Raman, as risk owner, decides and formally accepts the residual risk. <b>Assumptions:</b> the control effect comes from peer data; we will track a KCI (share of wires verified on the number of record) and a KRI (fraud attempts reaching approval) and re-run the model after two quarters. The tail of the loss range rests on peer data because five years of our own history cannot show a rare large loss.</p>',
        reviewNote: 'State the number, the tolerance comparison, the decision owner, and the assumptions.' }
    ],
    kus: ['Cybersecurity Planning and Management (CPM)', 'Cyber Threats (CTH)', 'IA Compliance (IAC)'],

    workbench: function (root, api) {
      var esc = api.esc;
      root.innerHTML = '<div class="lb-tool"><div class="lb-tabs" role="tablist" aria-label="Workbench tools">' +
        '<button role="tab" id="b3-tb-data" aria-controls="b3-pn-data" aria-selected="true">Data sources</button>' +
        '<button role="tab" id="b3-tb-model" aria-controls="b3-pn-model" aria-selected="false" tabindex="-1">Model</button></div>' +
        '<div class="lb-panel b3-doc" role="tabpanel" id="b3-pn-data" aria-labelledby="b3-tb-data">' + DATA() + '</div>' +
        '<div class="lb-panel" role="tabpanel" id="b3-pn-model" aria-labelledby="b3-tb-model" hidden>' + MODEL() + '</div></div>';
      var tabs = [].slice.call(root.querySelectorAll('[role=tab]'));
      function sel(t) { tabs.forEach(function (x) { var on = x === t; x.setAttribute('aria-selected', on); x.tabIndex = on ? 0 : -1; document.getElementById(x.getAttribute('aria-controls')).hidden = !on; }); api.note('tab', t.id); if (t.id === 'b3-tb-model') draw(); }

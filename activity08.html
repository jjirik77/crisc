      items: [

        },

          title: 'Case 2: The executive team', text: 'Saltreach’s executive team meets monthly to steer the business units.',

          ]

            { text: 'Close the plan when evidence shows the target residual risk was reached', rank: 5, why: 'Closure depends on the result, not on ticking the last task.' },

            { text: 'Validate: reconcile to the source, spot-check a sample, and confirm with the data owner', rank: 1, why: 'Data is validated before anyone relies on it.' },

<script>
/* ===================== Model data (fixed) =====================
   Brightwater Credit Union, quarterly scenario and register workshop.
   Answers below are computed from these arrays and the written rules. */
(function () {
  var CRIT = { Critical: 4, High: 3, Medium: 2, Low: 1 };
  var V = [
    { id: 'V01', f: 'Authentication bypass in Edgegate SSL VPN 9.2', a: 'Remote access VPN appliance', c: 'Critical', net: true, cvss: 8.7, epss: 0.94, kev: true },
    { id: 'V02', f: 'Privilege escalation in LedgerCore DB 19 listener', a: 'Core banking database server', c: 'Critical', net: false, cvss: 9.3, epss: 0.02, kev: false },
    { id: 'V03', f: 'Remote code execution in Wikiloft 4.1 plug-in', a: 'Marketing intranet wiki', c: 'Low', net: false, cvss: 9.8, epss: 0.01, kev: false },
    { id: 'V04', f: 'Server-side request forgery in the web front end framework', a: 'Online banking web front end (cloud tenant)', c: 'Critical', net: true, cvss: 7.5, epss: 0.31, kev: false },
    { id: 'V05', f: 'Print spooler privilege escalation', a: 'Branch print server', c: 'Low', net: false, cvss: 7.8, epss: 0.62, kev: true },
    { id: 'V06', f: 'Browser memory corruption, exploited in the wild', a: 'Wire-transfer workstations (6)', c: 'Critical', net: false, cvss: 8.8, epss: 0.41, kev: true },
    { id: 'V07', f: 'Message filter bypass in MailHarbor gateway', a: 'Email security gateway', c: 'High', net: true, cvss: 6.1, epss: 0.27, kev: true },
    { id: 'V08', f: 'PDF reader heap overflow', a: 'Staff laptops, back office', c: 'Medium', net: false, cvss: 7.8, epss: 0.05, kev: false },
    { id: 'V09', f: 'Information leak in controller web console', a: 'ATM network controller', c: 'High', net: false, cvss: 5.3, epss: 0.004, kev: false },
    { id: 'V10', f: 'Kernel privilege escalation', a: 'Teller workstations (40)', c: 'Medium', net: false, cvss: 8.1, epss: 0.18, kev: false }
  ];
  function tier(v) {
    if (v.kev && (v.net || v.c === 'Critical')) return 1;
    if (v.kev || v.epss >= 0.10 || (v.cvss >= 9.0 && CRIT[v.c] >= 3)) return 2;
    if (v.cvss >= 7.0) return 3;
    return 4;
  }
  V.forEach(function (v) { v.tier = tier(v); });
  var vRank = V.slice().sort(function (a, b) { return a.tier - b.tier || CRIT[b.c] - CRIT[a.c] || b.epss - a.epss; });

  var OWNERS = [
    ['COO', 'Renee Castellano, Chief Operating Officer'],
    ['VPP', 'Dmitri Hale, VP Payments Operations'],
    ['CDO', 'Lena Ostrowski, Chief Digital Officer'],
    ['VPM', 'Tomas Ibarra, VP Member Services'],
    ['CIO', 'Walter Nguyen, Chief Information Officer'],
    ['CISO', 'Keisha Barnwell, CISO'],
    ['CFO', 'Graham Liu, Chief Financial Officer'],
    ['RA', 'Risk analyst, ERM (you)']
  ];
  var OBJ = [
    ['O1', 'Keep core member services available'],
    ['O2', 'Protect member funds in payments and transfers'],
    ['O3', 'Protect member data and meet GLBA safeguards'],
    ['O4', 'Grow digital membership by 15% this year']
  ];
  var PICK = {
    actor: ['Cybercriminal ransomware group', 'Organized fraud ring', 'External attacker using stolen credentials', 'External attacker exploiting a web flaw', 'Malicious insider (teller)', 'Staff member making an error'],
    type: ['Malicious', 'Accidental', 'Failure', 'Natural', 'External requirement'],
    event: ['Interruption', 'Disclosure', 'Modification', 'Theft', 'Destruction'],
    asset: ['Core banking platform', 'Wire-transfer process', 'Online banking platform', 'Member data in the online banking tenant', 'Member data in branch teller systems'],
    time: ['Lasts up to four days; detected within hours', 'Single event; detected after the funds leave', 'Over several weeks; detected late', 'One event; detected days later']
  };
  /* Scenario stubs from the workshop, with the keyed ratings from the scale. */
  var S = [
    { id: 'S1', t: 'Ransomware through the remote access VPN', src: 'TI-1, V01',
      ev: 'Cinder Tide is exploiting the Edgegate VPN flaw (KEV listed) at credit unions this month. Brightwater runs the affected version on its internet-facing VPN (V01), not yet patched. At the two peers hit, the core banking platform was encrypted and recovery took three to five days.',
      L: 5, I: 5, own: 'COO', obj: 'O1' },
    { id: 'S2', t: 'Business email compromise of closing wires', src: 'TI-2, incident log',
      ev: 'Two attempts in the last six months. In May, a $180,000 wire to a spoofed title company was sent and later recalled. The largest closing wire this quarter is $2.4 million. Wire operations are a business process; the email gateway is an IT control.',
      L: 5, I: 4, own: 'VPP', obj: 'O2' },
    { id: 'S3', t: 'Member data exposed through the online banking front end', src: 'V04, peer reports',
      ev: 'V04 is an unpatched flaw on the internet-facing online banking front end (EPSS 0.31, not on KEV, no campaign reported). Peers reported two similar exposures in the last three years. The tenant holds records for 38,000 online banking members.',
      L: 3, I: 4, own: 'CDO', obj: 'O3' },
    { id: 'S4', t: 'Account takeover by credential stuffing', src: 'TI-3',
      ev: 'An active credential-stuffing campaign targets credit union online banking. Brightwater has not seen a spike in failed sign-ins yet. Peers lost an average of $400,000 in fraudulent transfers per campaign, with no outage.',
      L: 4, I: 3, own: 'CDO', obj: 'O2' },
    { id: 'S5', t: 'Teller misuse of member data', src: 'Internal audit note',
      ev: 'This needs a teller to abuse legitimate access. There has been no case at Brightwater in five years. A teller could view about 3,000 member profiles before the monthly access monitoring flagged it. No funds move.',
      L: 2, I: 3, own: 'VPM', obj: 'O3' }
  ];
  function sc(x) { return x.L * x.I; }
  var sRank = S.slice().sort(function (a, b) { return sc(b) - sc(a) || b.I - a.I || (a.id < b.id ? -1 : 1); });
  window.B2DATA = {
    V: V, S: S, OWNERS: OWNERS, OBJ: OBJ, PICK: PICK, CRIT: CRIT,
    answers: {
      tier1: V.filter(function (v) { return v.tier === 1; }).map(function (v) { return v.id; }),
      top: vRank[0].id,
      kev: V.filter(function (v) { return v.kev; }).length,
      first: sRank[0].id,
      high: S.filter(function (x) { return sc(x) >= 15; }).map(function (x) { return x.id; }),
      order: sRank.map(function (x) { return x.id; }).join(', ')
    }
  };
})();
</script>

<script>
(function () {
  var X = window.B2DATA, api0 = null;
  function A(k) { return function () { return X.answers[k]; }; }
  function scored() { var r = (api0 && api0.note('reg')) || {}; return X.S.every(function (s) { return r[s.id] && r[s.id].L && r[s.id].I; }); }
  var LOCK = 'Rate likelihood and impact for all five entries in the Risk register tab first. The heat map and ranking then fill in.';
  window.LAB = {
    id: 'B2',
    title: 'Risk Scenario and Register Workshop',
    accent: 'Register Workshop',
    domain: 'Domain 2 (22%)',
    time: '70 min',
    level: 'Intermediate',
    lessonHref: 'lesson03.html#s5',
    lessonLabel: 'Lesson 3, Risk Scenario Development',
    lede: 'Scenarios turn threats and weaknesses into statements a business owner can own. Triage a vulnerability scan with CVSS, EPSS, and KEV, turn the intelligence into five register entries with owners and ratings, and watch the heat map show where Brightwater should act first.',
    workbenchTitle: 'Register workbench',
    kus: ['Cyber Threats (CTH)', 'Vulnerability Analysis (VLA)', 'Cybersecurity Planning and Management (CPM)'],
    ticket: {
      number: 'RSK-2026-0927',
      priority: 'High priority',
      from: 'Elena Marsh, Chief Risk Officer, Brightwater Credit Union',
      to: 'Risk analyst, Enterprise Risk Management (you)',
      subject: 'Quarterly scenario workshop: register entries and scan triage',
      due: 'Before the risk committee on Thursday',
      body: '<p>The quarterly scenario workshop produced five candidate scenarios, and this week&rsquo;s threat intelligence and vulnerability scan both landed on my desk. The risk committee meets Thursday.</p>' +
        '<p>First, triage the scan using our vulnerability prioritization rule. IT wants to start with the highest CVSS score; I want the rule applied. Tell me which findings are Tier 1 and which one goes first, and how many are on the KEV catalog.</p>' +
        '<p>Then build the five register entries: complete each scenario statement, link it to a business objective, name the risk owner using our ownership rule, and rate inherent likelihood and impact on our scale. I need the heat map, the priority order, and the scenarios above appetite. Please remember that you facilitate; the owners will validate.</p>'
    },
    howTo: 'Read the <b>Threat intel</b> and <b>Objectives and scales</b> tabs. In the <b>Scan export</b>, assign each finding a tier with the rule; you can sort and filter the export. In the <b>Risk register</b>, complete each entry from its menus. The statement, quality checks, inherent score, heat map, and ranking update live. Select a chip on the heat map to jump to its entry.',
    workIntro: 'Inherent score is likelihood times impact on Brightwater&rsquo;s 1 to 5 scales. Ties rank by impact first.',
    checklist: [
      { id: 'tier1', type: 'set', points: 12, short: 'Tier 1 findings', title: 'Findings in Tier 1',
        task: 'Apply Brightwater&rsquo;s prioritization rule to the scan export. Which findings are <b>Tier 1</b>? Enter the finding IDs.',
        label: 'Finding IDs', placeholder: 'e.g., V02, V03',
        answer: A('tier1'),
        hint: 'Tier 1 needs two things at once: the finding is on the KEV catalog, and the asset is internet facing or Critical. Look past the CVSS column.',
        debrief: '<p>Three findings are Tier 1: <b>V01</b> (VPN appliance, KEV, internet facing, Critical), <b>V06</b> (wire-transfer workstations, KEV, Critical), and <b>V07</b> (email gateway, KEV, internet facing). V07 has a CVSS of only 6.1, which is exactly why CVSS alone misleads: it is being exploited now on a system the internet can reach.</p><p>V05 is also on KEV but sits on a Low-criticality internal print server, so it falls to Tier 2. V03 has the highest CVSS in the export (9.8) but low EPSS on a Low asset, so it is Tier 3.</p>',
        reviewNote: 'Prioritize by exploitation evidence and asset context, not CVSS alone.' },
      { id: 'top', type: 'choice', points: 10, short: 'First fix', title: 'The finding that goes first',
        task: 'Within a tier, Brightwater ranks by asset criticality, then by EPSS. Which finding should be remediated or isolated first?',
        options: ['V03, the CVSS 9.8 flaw on the intranet wiki', 'V02, the CVSS 9.3 flaw on the core banking database', 'V01, the KEV-listed flaw on the internet-facing VPN appliance', 'V06, the KEV-listed browser flaw on the wire-transfer workstations'],
        answer: 2,
        hint: 'V01 and V06 are both Tier 1 and both Critical. Compare their EPSS, and read TI-1.',
        debrief: '<p><b>V01 goes first.</b> It is Tier 1, Critical, and has the highest EPSS in the export (0.94). TI-1 confirms a ransomware group is using it against credit unions now. If a patch cannot be applied within the 72-hour target, isolate the appliance or move remote access to another path; that is still remediation in the rule&rsquo;s terms.</p><p>V03 is the trap. A 9.8 on an internal marketing wiki with a 1% chance of exploitation is not where an attacker is going. V06 is second.</p>',
        reviewNote: 'Rank within a tier by asset criticality, then by likelihood of exploitation (EPSS).' },
      { id: 'kev', type: 'number', points: 8, short: 'KEV count', title: 'Findings on the KEV catalog',
        task: 'How many findings in the scan export are on the CISA KEV catalog?',
        answer: A('kev'), tol: 0, unit: 'findings',
        hint: 'Use the KEV-only filter in the scan export.',
        debrief: '<p><b>Four</b> findings are KEV listed: V01, V05, V06, and V07. KEV means there is reliable evidence of active exploitation. It does not say how much the asset matters, which is why one of the four (V05) still lands in Tier 2.</p><p>The KEV count is also a useful KRI. A rising count of KEV-listed findings open past target is an early warning that remediation capacity is not keeping up.</p>',
        reviewNote: 'KEV marks active exploitation; combine it with asset criticality.' },
      { id: 'first', type: 'choice', points: 12, short: 'Highest score', title: 'The scenario with the highest inherent score',
        task: 'After you rate all five entries, which scenario has the highest inherent score?',
        options: ['S1, ransomware through the remote access VPN', 'S2, business email compromise of closing wires', 'S3, member data exposed through the online banking front end', 'S4, account takeover by credential stuffing'],
        answer: 0,
        locked: function () { return scored() ? false : LOCK; },
        hint: 'Read the likelihood scale closely. An active campaign exploiting a flaw Brightwater has right now is the top likelihood level. A core outage longer than two days is the top impact level.',
        debrief: '<p><b>S1 scores 25</b> (likelihood 5, impact 5). Likelihood is 5 because a campaign is exploiting a flaw Brightwater has on an internet-facing system today. Impact is 5 because peers lost the core platform for three to five days, beyond the two-day threshold.</p><p>S2 scores 20 (5 x 4): it has already happened here, and the largest exposure is $2.4 million, which is in the $1 million to $5 million band. These two scenarios drive the committee discussion.</p>',
        reviewNote: 'Rate from the evidence against the written scale; the top level is reserved for current, specific evidence.' },
      { id: 'high', type: 'set', points: 12, short: 'Above appetite', title: 'Scenarios rated High (15 or more)',
        task: 'Brightwater&rsquo;s appetite says inherent scores of 15 or more are High and need a response plan reported to the risk committee. Which scenarios are High?',
        label: 'Scenario IDs', placeholder: 'e.g., S3',
        answer: A('high'),
        locked: function () { return scored() ? false : LOCK; },
        hint: 'Check S3 and S4 carefully. Each has one factor at 4, but what is the other?',
        debrief: '<p><b>S1 (25) and S2 (20)</b> are High. S3 (3 x 4) and S4 (4 x 3) both score 12, which is Medium: they need owners and treatment plans, but not a committee escalation this quarter. S5 scores 6, Low.</p><p>S3 and S4 sit in different cells with the same score. That is the point of a heat map over a sorted list: it shows that S3 is a lower-likelihood, higher-impact risk, and S4 the reverse, which suggests different responses.</p>',
        reviewNote: 'Apply the appetite threshold to inherent scores, then read the heat map for the shape of each risk.' },
      { id: 'owner', type: 'choice', points: 12, short: 'Owner of S2', title: 'The risk owner for S2',
        task: 'Using the ownership rule, who should own S2, business email compromise of closing wires?',
        options: ['Keisha Barnwell, CISO, because the attack starts with email', 'Walter Nguyen, CIO, because he runs the email gateway', 'Dmitri Hale, VP Payments Operations, because he owns the wire-transfer process', 'You, the risk analyst, because you wrote the scenario'],
        answer: 2,
        hint: 'The ownership rule assigns the risk to the business owner of the process or system the scenario names, not to the owner of the control that might stop it.',
        debrief: '<p><b>The VP Payments Operations</b> owns S2. The loss lands on the wire-transfer process he runs, he can change the process (call-back verification to a known number, dual approval above a threshold), and he must accept any residual risk. The CISO and CIO own controls that help, such as email filtering and banner warnings, so they are control owners and are consulted.</p><p>The risk analyst never owns a register entry. You facilitate the scenario and challenge the ratings; the owner validates and decides.</p>',
        reviewNote: 'Risk owner: the business owner accountable for the process or objective; control owners support.' },
      { id: 'order', type: 'choice', points: 10, short: 'Priority order', title: 'The priority order of the register',
        task: 'Using inherent score with ties broken by impact, what is the priority order of the five entries?',
        options: ['S1, S2, S4, S3, S5', 'S1, S2, S3, S4, S5', 'S2, S1, S3, S4, S5', 'S1, S3, S2, S4, S5'],
        answer: 1,
        locked: function () { return scored() ? false : LOCK; },
        hint: 'S3 and S4 tie at 12. Which one has the higher impact?',
        debrief: '<p>The order is <b>S1 (25), S2 (20), S3 (12, impact 4), S4 (12, impact 3), S5 (6)</b>. The tie rule favors S3 because Brightwater would rather prevent the larger single loss: 38,000 member records and a GLBA notification.</p><p>Inherent order sets the agenda for Lesson 4&rsquo;s analysis. Residual risk, after current controls, may reorder the list, and that is where the response conversation starts.</p>',
        reviewNote: 'Rank by score, then by impact on ties.' },
      { id: 'memo', type: 'text', points: 24, short: 'Committee note', title: 'Write the register note for the risk committee', reportTitle: 'Register note for the risk committee',
        task: 'Write the note Elena will take to the risk committee. Use scenario and finding IDs.',
        fields: [
          { key: 'vuln', label: 'Scan triage and immediate actions', min: 50, placeholder: 'Tier 1 findings, the first fix, and the target time.' },

    workbench: function (root, api) {

          opts.map(function (o) { var v = Array.isArray(o) ? o[0] : o, t = Array.isArray(o) ? o[0] + ': ' + o[1] : o; return '<option value="' + esc(v) + '"' + (cur === v ? ' selected' : '') + '>' + esc(t) + '</option>'; }).join('') + '</select></label>';
      }
      function drawRG(focusId) {
        var R = reg(), pn = document.getElementById('pn-rg');
        var rated = X.S.filter(function (s) { var e = R[s.id] || {}; return e.L && e.I; });
        var rk = rated.map(function (s) { var e = R[s.id]; return { id: s.id, t: s.t, L: +e.L, I: +e.I, sc: e.L * e.I, own: e.own }; }).sort(function (a, b) { return b.sc - a.sc || b.I - a.I || (a.id < b.id ? -1 : 1); });
        var ents = X.S.map(function (s) {
          var e = R[s.id] || {}, sc = e.L && e.I ? e.L * e.I : null;
          var stmt = (e.actor ? esc(e.actor) : '<span class="gap">[actor]</span>') + ' (' + (e.type ? esc(e.type.toLowerCase()) : '<span class="gap">threat type</span>') + ') causes ' +
            (e.event ? esc(e.event.toLowerCase()) : '<span class="gap">[event]</span>') + ' affecting the ' + (e.asset ? esc(e.asset.toLowerCase()) : '<span class="gap">[asset]</span>') + '. ' +
            (e.time ? esc(e.time) + '.' : '<span class="gap">[time]</span>') + ' This threatens ' + (e.obj ? esc(X.OBJ.filter(function (o) { return o[0] === e.obj; })[0][1].toLowerCase()) : '<span class="gap">[objective]</span>') + '.';
          var comp = FIELDS.every(function (f) { return e[f[0]]; });
          var chk = [[comp, 'Five components'], [!!e.obj, 'Linked to an objective'], [!!e.own, 'Owner named'], [!!sc, 'Rated']];
          return '<div class="b2-ent" id="b2-ent-' + s.id + '"><h5><span class="id">' + s.id + '</span>' + esc(s.t) + (sc ? '<span class="b2-score ' + band(sc) + '">' + sc + '</span>' : '') + '</h5>' +
            '<p class="b2-ev"><b>Sources:</b> ' + esc(s.src) + '. ' + esc(s.ev) + '</p><div class="b2-grid">' +
            FIELDS.map(function (f) { return selHTML(s.id, f[0], f[1], X.PICK[f[0]], e[f[0]]); }).join('') +
            selHTML(s.id, 'obj', 'Objective', X.OBJ, e.obj) + selHTML(s.id, 'own', 'Risk owner', X.OWNERS, e.own) +
            selHTML(s.id, 'L', 'Likelihood', ['1', '2', '3', '4', '5'], e.L ? String(e.L) : '', 's') + selHTML(s.id, 'I', 'Impact', ['1', '2', '3', '4', '5'], e.I ? String(e.I) : '', 's') +
            '</div><p class="b2-stmt">' + stmt + '</p><div class="b2-checks">' + chk.map(function (c) { return c[0] ? '<span class="b2-ok">&#10003; ' + c[1] + '</span>' : '<span class="b2-no">&#9675; ' + c[1] + '</span>'; }).join('') + '</div></div>';
        }).join('');
        var heat = '<table class="b2-heat"><caption class="sr-only">Inherent risk heat map, impact rows by likelihood columns</caption><tbody>';
        for (var i = 5; i >= 1; i--) {
          heat += '<tr><th scope="row">I' + i + '</th>';
          for (var l = 1; l <= 5; l++) {
            var here = rk.filter(function (r) { return r.L === l && r.I === i; });
            heat += '<td class="' + band(l * i) + '">' + here.map(function (r) { return '<button type="button" class="b2-chip" data-jump="' + r.id + '" aria-label="' + r.id + ', likelihood ' + l + ', impact ' + i + ', score ' + r.sc + '. Go to entry">' + r.id + '</button>'; }).join('') + '<span class="sc" aria-hidden="true">' + l * i + '</span></td>';
          }
          heat += '</tr>';
        }
        heat += '<tr><th></th>' + [1, 2, 3, 4, 5].map(function (l) { return '<th scope="col">L' + l + '</th>'; }).join('') + '</tr></tbody></table><p class="b2-axis">Likelihood &rarr; &nbsp; (impact &uarr;)</p>' +
          '<div class="b2-legend"><span><i style="background:var(--wrong-bg);border:1px solid var(--wrong)"></i>High, 15 to 25</span><span><i style="background:var(--jade-pale);border:1px solid var(--jade-border)"></i>Medium, 8 to 14</span><span><i style="background:var(--correct-bg);border:1px solid var(--correct)"></i>Low, 1 to 7</span></div>';
        var ownName = function (k) { var o = X.OWNERS.filter(function (x) { return x[0] === k; })[0]; return o ? o[1].split(',')[0] : 'no owner'; };
        pn.innerHTML = '<div class="b2-tiles"><div class="b2-tile"><div class="k">Entries rated</div><div class="v">' + rated.length + ' of 5</div></div>' +
          '<div class="b2-tile"><div class="k">High (15+)</div><div class="v">' + (rated.length === 5 ? rk.filter(function (r) { return r.sc >= 15; }).length : '&middot;') + '</div></div>' +
          '<div class="b2-tile"><div class="k">Top scenario</div><div class="v">' + (rated.length === 5 ? rk[0].id + ' (' + rk[0].sc + ')' : '&middot;') + '</div></div></div>' +

        refocus(focusId);
      }
      drawRG();
    },
    onReset: function () { }
  };

  function INTEL() {
